<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<head th:replace="~{common/layout :: head}">
    <title>Members — Admin</title>
</head>
<body>

<nav th:replace="~{common/layout :: nav}"></nav>

<section class="page-section">
    <div class="container">

        <div class="page-header">
            <a class="back-link" th:href="@{/admin/dashboard}">← Dashboard</a>
            <h1 class="section-title"
                th:text="${role == 'CLIENT'} ? #{admin.clients} : #{admin.trainers}">
                Members
            </h1>
        </div>

        <div th:if="${success}" class="alert alert--success" th:text="${success}"></div>
        <div th:if="${error}"   class="alert alert--error"   th:text="${error}"></div>

        <!-- Empty state -->
        <div th:if="${page.content.empty}" class="empty-state">
            <p class="section-sub">No members found.</p>
        </div>

        <!-- Members table -->
        <div th:unless="${page.content.empty}" class="table-wrap">
            <table class="data-table">
                <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Status</th>
                    <th th:if="${role == 'CLIENT'}">Account Type</th>
                    <th th:if="${role == 'CLIENT'}">Discount</th>
                    <th th:if="${role == 'TRAINER'}">Availability</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="member : ${page.content}">

                    <td class="data-table__name"
                        th:text="${member.firstName + ' ' + member.lastName}">Name</td>

                    <td class="data-table__meta"
                        th:text="${member.email}">email</td>

                    <td>
                        <span th:if="${member.enabled}"
                              class="badge badge--active"
                              th:text="#{admin.status.active}">Active</span>
                        <span th:unless="${member.enabled}"
                              class="badge badge--inactive"
                              th:text="#{admin.status.inactive}">Inactive</span>
                    </td>

                    <!-- Account Type column — clients only -->
                    <td th:if="${role == 'CLIENT'}">
                        <form th:action="@{/admin/member/account-type/{id}(id=${member.id})}"
                              method="post"
                              class="discount-form">
                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}"/>
                            <input type="hidden" name="redirectTo"
                                   th:value="${role == 'CLIENT'} ? '/admin/clients' : '/admin/trainers'"/>
                            <select class="form-select" name="accountType">
                                <option value="REGULAR"
                                        th:selected="${member.accountType == null or member.accountType.name() == 'REGULAR'}">Regular</option>
                                <option value="CORPORATE"
                                        th:selected="${member.accountType != null and member.accountType.name() == 'CORPORATE'}">Corporate</option>
                            </select>
                            <button class="btn btn--outline btn--sm" type="submit"
                                    th:text="#{admin.discount.apply}">Apply</button>
                        </form>
                    </td>

                    <!-- Discount column — clients only -->
                    <td th:if="${role == 'CLIENT'}">
                        <form th:action="@{/admin/member/discount/{id}(id=${member.id})}"
                              method="post"
                              class="discount-form">
                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}"/>
                            <input type="hidden" name="redirectTo"
                                   th:value="${role == 'CLIENT'} ? '/admin/clients' : '/admin/trainers'"/>
                            <input class="discount-input"
                                   type="number"
                                   name="discountPercent"
                                   min="0" max="100"
                                   th:value="${member.discountPercent != null ? member.discountPercent : 0}"/>
                            <span class="discount-pct">%</span>
                            <button class="btn btn--outline btn--sm" type="submit"
                                    th:text="#{admin.discount.apply}">Apply</button>
                        </form>
                    </td>

                    <!-- Availability column — trainers only -->
                    <td th:if="${role == 'TRAINER'}"
                        th:with="trainerInfo=${trainerAvailability.?[id == member.id]}">
                        <form th:action="@{/admin/trainer/availability/{id}(id=${member.id})}"
                              method="post"
                              class="discount-form">
                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}"/>
                            <input type="hidden" name="redirectTo" value="/admin/trainers"/>
                            <select class="form-select" name="availabilityStatus">
                                <option value="AVAILABLE"
                                        th:selected="${#lists.isEmpty(trainerInfo) or trainerInfo[0].availabilityStatus == null or trainerInfo[0].availabilityStatus.name() == 'AVAILABLE'}">Available</option>
                                <option value="UNAVAILABLE"
                                        th:selected="${!#lists.isEmpty(trainerInfo) and trainerInfo[0].availabilityStatus != null and trainerInfo[0].availabilityStatus.name() == 'UNAVAILABLE'}">Unavailable</option>
                            </select>
                            <button class="btn btn--outline btn--sm" type="submit"
                                    th:text="#{admin.discount.apply}">Apply</button>
                        </form>
                    </td>

                    <!-- Actions -->
                    <td>
                        <div class="action-row">
                            <!-- Activate -->
                            <form th:if="${!member.enabled}"
                                  th:action="@{/admin/member/activate/{id}(id=${member.id})}"
                                  method="post">
                                <input type="hidden"
                                       th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}"/>
                                <input type="hidden" name="redirectTo"
                                       th:value="${role == 'CLIENT'} ? '/admin/clients' : '/admin/trainers'"/>
                                <button class="btn btn--primary btn--sm" type="submit"
                                        th:text="#{admin.status.activate}">Activate</button>
                            </form>
                            <!-- Deactivate -->
                            <form th:if="${member.enabled}"
                                  th:action="@{/admin/member/deactivate/{id}(id=${member.id})}"
                                  method="post">
                                <input type="hidden"
                                       th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}"/>
                                <input type="hidden" name="redirectTo"
                                       th:value="${role == 'CLIENT'} ? '/admin/clients' : '/admin/trainers'"/>
                                <button class="btn btn--outline btn--sm" type="submit"
                                        th:text="#{admin.status.deactivate}">Deactivate</button>
                            </form>
                        </div>
                    </td>

                </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination — FIX: используем th:if/else вместо динамического @{} -->
        <div th:if="${page.totalPages > 1}" class="pagination">

            <!-- Clients pagination -->
            <th:block th:if="${role == 'CLIENT'}">
                <a class="pagination__btn"
                   th:if="${page.currentPage > 1}"
                   th:href="@{/admin/clients(page=${page.currentPage - 1})}"
                   th:text="#{pagination.prev}">← Prev</a>
                <span th:unless="${page.currentPage > 1}"
                      class="pagination__btn" style="opacity:0.3; cursor:default;">← Prev</span>

                <span class="pagination__info"
                      th:text="'Page ' + ${page.currentPage} + ' of ' + ${page.totalPages}">
              Page 1 of 2
            </span>

                <a class="pagination__btn"
                   th:if="${page.currentPage < page.totalPages}"
                   th:href="@{/admin/clients(page=${page.currentPage + 1})}"
                   th:text="#{pagination.next}">Next →</a>
                <span th:unless="${page.currentPage < page.totalPages}"
                      class="pagination__btn" style="opacity:0.3; cursor:default;">Next →</span>
            </th:block>

            <!-- Trainers pagination -->
            <th:block th:if="${role == 'TRAINER'}">
                <a class="pagination__btn"
                   th:if="${page.currentPage > 1}"
                   th:href="@{/admin/trainers(page=${page.currentPage - 1})}"
                   th:text="#{pagination.prev}">← Prev</a>
                <span th:unless="${page.currentPage > 1}"
                      class="pagination__btn" style="opacity:0.3; cursor:default;">← Prev</span>

                <span class="pagination__info"
                      th:text="'Page ' + ${page.currentPage} + ' of ' + ${page.totalPages}">
              Page 1 of 2
            </span>

                <a class="pagination__btn"
                   th:if="${page.currentPage < page.totalPages}"
                   th:href="@{/admin/trainers(page=${page.currentPage + 1})}"
                   th:text="#{pagination.next}">Next →</a>
                <span th:unless="${page.currentPage < page.totalPages}"
                      class="pagination__btn" style="opacity:0.3; cursor:default;">Next →</span>
            </th:block>

        </div>

    </div>
</section>

<footer th:replace="~{common/layout :: footer}"></footer>
</body>
</html>
