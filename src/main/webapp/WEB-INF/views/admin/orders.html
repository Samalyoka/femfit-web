<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<head th:replace="~{common/layout :: head}">
  <title>All Orders — Admin</title>
</head>
<body>

<nav th:replace="~{common/layout :: nav}"></nav>

<section class="page-section">
  <div class="container">

    <div class="page-header">
      <a class="back-link" th:href="@{/admin/dashboard}" th:text="#{admin.dashboard.back}">← Dashboard</a>
      <h1 class="section-title" th:text="#{admin.orders}">All Orders</h1>
    </div>

    <div th:if="${success}" class="alert alert--success" th:text="#{${success}}"></div>

    <!-- Empty state -->
    <div th:if="${orders.empty}" class="empty-state">
      <p class="section-sub" th:text="#{admin.orders.empty}">[[#{admin.orders.empty}]]</p>
    </div>

    <!-- Orders table -->
    <div th:unless="${orders.empty}" class="table-wrap">
      <table class="data-table">
        <thead>
        <tr>
          <th>#</th>
          <th th:text="#{table.client}">Client</th>
          <th th:text="#{table.program}">Program</th>
          <th th:text="#{table.trainer}">Trainer</th>
          <th th:text="#{table.amount}">Amount</th>
          <th th:text="#{table.status}">Status</th>
          <th th:text="#{table.date}">Date</th>
          <th th:text="#{table.actions}">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${orders}">

          <td class="data-table__meta"
              th:text="${order.id}">1</td>

          <td class="data-table__name"
              th:text="${order.clientName}">Client</td>

          <td th:text="${order.getLocalizedCycleTitle(#locale.language)}">Program</td>

          <td class="data-table__meta"
              th:text="${order.trainerName != null ? order.trainerName : '—'}">—</td>

          <td th:text="${#numbers.formatDecimal(order.paidAmount, 0, 'COMMA', 0, 'POINT') + ' ₸'}">
            0 ₸
          </td>

          <td>
                        <span class="badge"
                              th:text="${order.status == 'ACTIVE'} ? #{order.status.active} : (${order.status == 'COMPLETED'} ? #{order.status.completed} : (${order.status == 'CANCELLED'} ? #{order.status.cancelled} : #{order.status.pending}))"
                              th:classappend="${order.status == 'ACTIVE'}    ? ' badge--active'
                                           : (${order.status == 'COMPLETED'} ? ' badge--success'
                                           : (${order.status == 'CANCELLED'} ? ' badge--inactive'
                                           : ' badge--warning'))">
                            ACTIVE
                        </span>
          </td>

          <td class="data-table__meta"
              th:text="${order.createdAt != null}
                                 ? ${@dateFormatter.format(order.createdAt)}
                                 : '—'">
            —
          </td>

          <!-- Status actions -->
          <td>
            <div class="action-row">
              <form th:if="${order.status == 'ACTIVE'}"
                    th:action="@{/admin/order/complete/{id}(id=${order.id})}"
                    method="post">
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}"/>
                <button class="btn btn--outline btn--sm" type="submit">
                  Complete
                </button>
              </form>
              <form th:if="${order.status == 'ACTIVE' or order.status == 'PENDING'}"
                    th:action="@{/admin/order/cancel/{id}(id=${order.id})}"
                    method="post">
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}"/>
                <button class="btn btn--danger btn--sm" type="submit">
                  Cancel
                </button>
              </form>
              <!-- Reassign trainer — e.g. when the current trainer is
                   unavailable (vacation, sick leave). Only offered for
                   orders that are still in progress, and only available
                   trainers are listed as targets. -->
              <form th:if="${order.status == 'ACTIVE' or order.status == 'PENDING'}"
                    th:action="@{/admin/order/reassign-trainer/{id}(id=${order.id})}"
                    method="post"
                    class="discount-form">
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}"/>
                <select class="form-select" name="trainerId">
                  <option th:each="t : ${availableTrainers}"
                          th:value="${t.id}"
                          th:text="${t.fullName}"
                          th:selected="${order.trainerId != null and order.trainerId == t.id}">Trainer</option>
                </select>
                <button class="btn btn--outline btn--sm" type="submit">
                  Reassign
                </button>
              </form>
            </div>
          </td>

        </tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div th:if="${totalPages > 1}" class="pagination">
      <th:block th:if="${currentPage > 1}">
        <a class="pagination__btn"
           th:href="@{/admin/orders(page=${currentPage - 1})}"
           th:text="#{pagination.prev}">← Previous</a>
      </th:block>
      <th:block th:unless="${currentPage > 1}">
        <span class="pagination__btn" style="opacity:0.3; cursor:default;" th:text="#{pagination.prev}">← Previous</span>
      </th:block>

      <span class="pagination__info"
            th:text="#{pagination.page(${currentPage}, ${totalPages})}">Page 1 of 3</span>

      <th:block th:if="${currentPage < totalPages}">
        <a class="pagination__btn"
           th:href="@{/admin/orders(page=${currentPage + 1})}"
           th:text="#{pagination.next}">Next →</a>
      </th:block>
      <th:block th:unless="${currentPage < totalPages}">
        <span class="pagination__btn" style="opacity:0.3; cursor:default;" th:text="#{pagination.next}">Next →</span>
      </th:block>
    </div>

  </div>
</section>

<footer th:replace="~{common/layout :: footer}"></footer>
</body>
</html>
