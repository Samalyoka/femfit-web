<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Users — FemFit Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root{--rose:#C4687A;--rose-light:#F5E8EA;--rose-dark:#7A3040;--border:#E8DDD8;--serif:'Cormorant Garamond',serif;}
        body{font-family:'DM Sans',sans-serif;background:#FDFAF7;color:#2C2420;}
        .table{background:white;border-radius:12px;overflow:hidden;border:0.5px solid var(--border);}
        .table thead th{background:#F7F3EE;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#8A7A72;border:none;font-weight:500;padding:12px 16px;}
        .table tbody td{padding:14px 16px;font-size:14px;border-color:var(--border);vertical-align:middle;}
        .badge-active{background:#E8F5EE;color:#2E7D52;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:500;}
        .badge-inactive{background:#F1EFE8;color:#8A7A72;padding:3px 10px;border-radius:12px;font-size:11px;}
        .btn-sm-rose{padding:4px 12px;background:var(--rose);color:white;border:none;border-radius:16px;font-size:12px;cursor:pointer;}
        .pagination .page-link{color:var(--rose-dark);border-color:var(--border);}
        .pagination .page-item.active .page-link{background:var(--rose);border-color:var(--rose);color:white;}
    </style>
</head>
<body>
<nav th:replace="~{common/layout :: nav}"></nav>

<div class="container py-5">
    <div class="d-flex align-items-center gap-3 mb-2">
        <a th:href="@{/admin/dashboard}" style="font-size:13px;color:#8A7A72;text-decoration:none;">← Dashboard</a>
    </div>
    <h1 style="font-family:var(--serif);font-size:32px;font-weight:400;color:#3D1520;margin-bottom:4px;" th:text="${role == 'CLIENT'} ? #{admin.clients} : #{admin.trainers}">Clients</h1>
    <p style="color:#8A7A72;margin-bottom:24px;" th:text="'Total: ' + ${page.totalItems}">Total: 0</p>

    <div class="alert" style="background:#E8F5EE;color:#2E7D52;border:none;" th:if="${success}" th:text="${success}"></div>

    <div class="table-responsive">
        <table class="table">
            <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Registered</th>
                <th>Status</th>
                <th th:if="${role == 'CLIENT'}">Discount</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${page.content}">
                <td th:text="${u.fullName}">Anna Kim</td>
                <td th:text="${u.email}" style="font-size:13px;color:#8A7A72;">anna@mail.kz</td>
                <td th:text="${#temporals.format(u.registrationDate,'d MMM yyyy')}" style="font-size:13px;color:#8A7A72;">1 Jun 2026</td>
                <td>
                    <span th:if="${u.active}" class="badge-active" th:text="#{admin.user.activate}">Active</span>
                    <span th:unless="${u.active}" class="badge-inactive">Inactive</span>
                </td>
                <td th:if="${role == 'CLIENT'}" style="font-size:13px;" th:text="${u.discountPercent} + '%'">0%</td>
                <td>
                    <div class="d-flex gap-2 align-items-center flex-wrap">
                        <!-- Activate/Deactivate -->
                        <form th:if="${!u.active}" th:action="@{/admin/user/activate/{id}(id=${u.id})}" method="post" class="d-inline">
                            <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>
                            <button class="btn-sm-rose" type="submit" th:text="#{admin.user.activate}">Activate</button>
                        </form>
                        <form th:if="${u.active}" th:action="@{/admin/user/deactivate/{id}(id=${u.id})}" method="post" class="d-inline">
                            <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>
                            <button class="btn btn-sm btn-outline-secondary" style="border-radius:16px;font-size:12px;" type="submit" th:text="#{admin.user.deactivate}">Deactivate</button>
                        </form>
                        <!-- Set discount (clients only) -->
                        <form th:if="${role == 'CLIENT'}" th:action="@{/admin/user/discount/{id}(id=${u.id})}" method="post" class="d-flex gap-1 align-items-center">
                            <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>
                            <input type="number" name="discountPercent" min="0" max="100"
                                   th:value="${u.discountPercent}"
                                   style="width:60px;font-size:12px;border:0.5px solid #E8DDD8;border-radius:8px;padding:4px 8px;">
                            <button class="btn-sm-rose" type="submit" style="background:#8A7A72;" th:text="#{admin.discount.set}">Set %</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <nav th:if="${page.totalPages > 1}" class="mt-4">
        <ul class="pagination">
            <li class="page-item" th:classappend="${!page.hasPrev()} ? 'disabled'">
                <a class="page-link" th:href="@{''(page=${page.currentPage - 1})}" th:text="#{pagination.prev}">Previous</a>
            </li>
            <li th:each="i : ${#numbers.sequence(1, page.totalPages)}"
                class="page-item" th:classappend="${i == page.currentPage} ? 'active'">
                <a class="page-link" th:href="@{''(page=${i})}" th:text="${i}">1</a>
            </li>
            <li class="page-item" th:classappend="${!page.hasNext()} ? 'disabled'">
                <a class="page-link" th:href="@{''(page=${page.currentPage + 1})}" th:text="#{pagination.next}">Next</a>
            </li>
        </ul>
    </nav>
</div>

<footer th:replace="~{common/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
