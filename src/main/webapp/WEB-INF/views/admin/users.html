<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users — FemFit Admin</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .table{background:white;border-radius:12px;overflow:hidden;border:0.5px solid var(--border);}
        .table thead th{background:var(--sand);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);border:none;font-weight:500;padding:12px 16px;}
        .table tbody td{padding:14px 16px;font-size:14px;border-color:var(--border);vertical-align:middle;}
        .badge-active{background:#E8F5EE;color:#2E7D52;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:500;}
        .badge-inactive{background:#F1EFE8;color:var(--muted);padding:3px 10px;border-radius:12px;font-size:11px;}
        .btn-sm-rose{padding:4px 12px;background:var(--rose);color:white;border:none;border-radius:16px;font-size:12px;cursor:pointer;}
        .pagination .page-link{color:var(--rose-dark);border-color:var(--border);}
        .pagination .page-item.active .page-link{background:var(--rose);border-color:var(--rose);color:white;}
    </style>
</head>
<body>
<nav th:replace="~{common/layout :: nav}"></nav>

<div class="container py-5">
    <a th:href="@{/admin/dashboard}" style="font-size:13px;color:var(--muted);text-decoration:none;">← Dashboard</a>
    <h1 class="section-title" th:text="${role == 'CLIENT'} ? #{admin.clients} : #{admin.trainers}">Users</h1>

    <div class="table-responsive">
        <table class="table">
            <thead>
            <tr><th>Name</th><th>Email</th><th>Registered</th><th>Status</th><th th:if="${role == 'CLIENT'}">Discount</th><th>Actions</th></tr>
            </thead>
            <tbody>
            <tr th:each="u : ${page.content}">
                <td th:text="${u.fullName}"></td>
                <td th:text="${u.email}" style="font-size:13px;color:var(--muted);"></td>
                <td th:text="${#temporals.format(u.registrationDate,'d MMM yyyy')}" style="font-size:13px;color:var(--muted);"></td>
                <td>
                    <span th:if="${u.active}" class="badge-active" th:text="#{admin.user.activate}">Active</span>
                    <span th:unless="${u.active}" class="badge-inactive">Inactive</span>
                </td>
                <td th:if="${role == 'CLIENT'}" style="font-size:13px;" th:text="${u.discountPercent} + '%'"></td>
                <td>
                    <div class="d-flex gap-2 align-items-center flex-wrap">
                        <form th:if="${!u.active}" th:action="@{/admin/user/activate/{id}(id=${u.id})}" method="post">
                            <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>
                            <button class="btn-sm-rose" type="submit" th:text="#{admin.user.activate}">Activate</button>
                        </form>
                        <form th:if="${u.active}" th:action="@{/admin/user/deactivate/{id}(id=${u.id})}" method="post">
                            <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>
                            <button class="btn-outline" style="padding:4px 12px;font-size:12px;" type="submit" th:text="#{admin.user.deactivate}">Deactivate</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<footer th:replace="~{common/layout :: footer}"></footer>
</body>
</html>
