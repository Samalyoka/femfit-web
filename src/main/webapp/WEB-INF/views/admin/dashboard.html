<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — FemFit</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root{--rose:#C4687A;--rose-light:#F5E8EA;--rose-dark:#7A3040;--border:#E8DDD8;--serif:'Cormorant Garamond',serif;}
    body{font-family:'DM Sans',sans-serif;background:#FDFAF7;color:#2C2420;}
    .stat-card{background:white;border:0.5px solid var(--border);border-radius:16px;padding:24px;text-align:center;}
    .stat-num{font-family:var(--serif);font-size:42px;color:var(--rose);}
    .nav-admin a{display:block;padding:10px 16px;border-radius:8px;text-decoration:none;font-size:14px;color:#2C2420;margin-bottom:4px;}
    .nav-admin a:hover{background:var(--rose-light);}
    .nav-admin a.active{background:var(--rose-light);color:var(--rose-dark);font-weight:500;}
  </style>
</head>
<body>
<nav th:replace="~{common/layout :: nav}"></nav>

<div class="container py-5">
  <h1 style="font-family:var(--serif);font-size:36px;font-weight:400;color:#3D1520;margin-bottom:32px;">Admin Dashboard</h1>

  <div class="row g-4">
    <div class="col-lg-3">
      <div class="nav-admin">
        <a th:href="@{/admin/dashboard}" class="active">Dashboard</a>
        <a th:href="@{/admin/clients}" th:text="#{admin.clients}">Clients</a>
        <a th:href="@{/admin/trainers}" th:text="#{admin.trainers}">Trainers</a>
      </div>
    </div>
    <div class="col-lg-9">
      <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
          <div class="stat-card">
            <div class="stat-num" th:text="${clientCount}">0</div>
            <div style="font-size:12px;color:#8A7A72;margin-top:4px;" th:text="#{admin.clients}">Clients</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="stat-card">
            <div class="stat-num" th:text="${trainerCount}">0</div>
            <div style="font-size:12px;color:#8A7A72;margin-top:4px;" th:text="#{admin.trainers}">Trainers</div>
          </div>
        </div>
      </div>

      <div class="d-flex gap-3">
        <a th:href="@{/admin/clients}" class="btn" style="background:var(--rose);color:white;border-radius:30px;font-size:13px;" th:text="#{admin.clients}">Manage Clients</a>
        <a th:href="@{/admin/trainers}" class="btn btn-outline-secondary" style="border-radius:30px;font-size:13px;" th:text="#{admin.trainers}">Manage Trainers</a>
      </div>
    </div>
  </div>
</div>

<footer th:replace="~{common/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
