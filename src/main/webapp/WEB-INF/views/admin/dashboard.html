<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/layout :: head}">
  <title>Admin Dashboard — FemFit</title>
</head>
<body>
<nav th:replace="~{common/layout :: nav}"></nav>

<div class="page-wrap">

  <div class="page-header">
    <div class="section-eyebrow">Administration</div>
    <h1 class="section-title">Dashboard</h1>
  </div>

  <!-- Navigation cards WITH stats inside -->
  <div class="admin-nav">

    <a th:href="@{/admin/clients}" class="admin-nav__card">
      <div class="admin-nav__stat" th:text="${clientCount}">0</div>
      <div class="admin-nav__title">Clients</div>
      <div class="admin-nav__sub">Manage accounts, activate or deactivate, set discounts</div>
    </a>

    <a th:href="@{/admin/trainers}" class="admin-nav__card">
      <div class="admin-nav__stat" th:text="${trainerCount}">0</div>
      <div class="admin-nav__title">Trainers</div>
      <div class="admin-nav__sub">Manage trainer accounts and access</div>
    </a>

    <a th:href="@{/admin/cycles}" class="admin-nav__card">
      <div class="admin-nav__stat" th:text="${activeCycles}">0</div>
      <div class="admin-nav__title">Training Cycles</div>
      <div class="admin-nav__sub">Create, edit and deactivate training programmes</div>
    </a>

    <a th:href="@{/admin/orders}" class="admin-nav__card">
      <div class="admin-nav__stat" th:text="${totalOrders}">0</div>
      <div class="admin-nav__title">Orders</div>
      <div class="admin-nav__sub">View and manage all client orders</div>
    </a>

    <a th:href="@{/admin/stats}" class="admin-nav__card">
      <div class="admin-nav__stat">→</div>
      <div class="admin-nav__title">Statistics</div>
      <div class="admin-nav__sub">Key metrics, recent reviews and reports</div>
    </a>

  </div>
</div>

<footer th:replace="~{common/layout :: footer}"></footer>
</body>
</html>
