<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<head th:replace="~{common/layout :: head}">
  <title>Admin Dashboard</title>
</head>
<body>

<nav th:replace="~{common/layout :: nav}"></nav>

<section class="page-section">
  <div class="container">

    <div class="page-header">
      <h1 class="section-title" th:text="#{admin.dashboard.title}">Admin Dashboard</h1>
    </div>

    <div th:if="${success}" class="alert alert--success" th:text="${success}"></div>
    <div th:if="${error}"   class="alert alert--error"   th:text="${error}"></div>

    <!-- Stats row -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-card__num" th:text="${clientCount}">0</div>
        <div class="stat-card__label" th:text="#{admin.clients}">Clients</div>
      </div>
      <div class="stat-card">
        <div class="stat-card__num" th:text="${trainerCount}">0</div>
        <div class="stat-card__label" th:text="#{admin.trainers}">Trainers</div>
      </div>
    </div>

    <!-- Quick links -->
    <div class="admin-nav">
      <a class="admin-nav__card"
         th:href="@{/admin/clients}">
        <div class="admin-nav__title" th:text="#{admin.clients}">Clients</div>
        <div class="admin-nav__sub" th:text="#{admin.clients.sub}">Activate, deactivate, set discounts</div>
      </a>
      <a class="admin-nav__card"
         th:href="@{/admin/trainers}">
        <div class="admin-nav__title" th:text="#{admin.trainers}">Trainers</div>
        <div class="admin-nav__sub" th:text="#{admin.trainers.sub}">View and manage trainers</div>
      </a>
      <a class="admin-nav__card"
         th:href="@{/admin/orders}">
        <div class="admin-nav__title" th:text="#{admin.orders}">All Orders</div>
        <div class="admin-nav__sub" th:text="#{admin.orders.sub}">View all client orders</div>
      </a>
    </div>

  </div>
</section>

<footer th:replace="~{common/layout :: footer}"></footer>
</body>
</html>
