<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/layout :: head}">
  <title>Admin Dashboard — FemFit</title>
</head>
<body>
<nav th:replace="~{common/layout :: nav}"></nav>

<div class="page-wrap">

  <div class="page-header">
    <div class="section-eyebrow" th:text="#{admin.administration}">Administration</div>
    <h1 class="section-title" th:text="#{admin.dashboard.title}">Dashboard</h1>
  </div>

  <!-- Navigation cards WITH stats inside -->
  <div class="admin-nav">

    <a th:href="@{/admin/clients}" class="admin-nav__card">
      <div class="admin-nav__stat" th:text="${clientCount}">0</div>
      <div class="admin-nav__title" th:text="#{admin.clients}">Clients</div>
      <div class="admin-nav__sub" th:text="#{admin.clients.sub}">Manage accounts</div>
    </a>

    <a th:href="@{/admin/trainers}" class="admin-nav__card">
      <div class="admin-nav__stat" th:text="${trainerCount}">0</div>
      <div class="admin-nav__title" th:text="#{admin.trainers}">Trainers</div>
      <div class="admin-nav__sub" th:text="#{admin.trainers.sub}">Manage trainer accounts</div>
    </a>

    <a th:href="@{/admin/cycles}" class="admin-nav__card">
      <div class="admin-nav__stat" th:text="${activeCycles}">0</div>
      <div class="admin-nav__title" th:text="#{admin.cycles}">Training Cycles</div>
      <div class="admin-nav__sub" th:text="#{admin.cycles.sub}">Create, edit programmes</div>
    </a>

    <a th:href="@{/admin/orders}" class="admin-nav__card">
      <div class="admin-nav__stat" th:text="${totalOrders}">0</div>
      <div class="admin-nav__title" th:text="#{admin.orders}">Orders</div>
      <div class="admin-nav__sub">View and manage all client orders</div>
    </a>

    <a th:href="@{/admin/stats}" class="admin-nav__card">
      <div class="admin-nav__stat">→</div>
      <div class="admin-nav__title" th:text="#{admin.stats}">Statistics</div>
      <div class="admin-nav__sub" th:text="#{admin.stats.sub}">Key metrics</div>
    </a>

  </div>
</div>

<footer th:replace="~{common/layout :: footer}"></footer>
</body>
</html>
