<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/layout :: head}">
    <title>Training Cycle Form — Admin — FemFit</title>
</head>
<body>
<nav th:replace="~{common/layout :: nav}"></nav>

<div class="page-wrap">

    <div class="page-header">
        <a th:href="@{/admin/cycles}" class="back-link" th:text="#{admin.cycles.back}">← Training Cycles</a>
        <h1 class="section-title"
            th:text="${isNew} ? #{cycle.form.title.new} : #{cycle.form.title.edit}">
            Training Cycle
        </h1>
        <!-- Show current cycle name when editing -->
        <p th:unless="${isNew}" class="profile-empty"
           th:text="${cycle?.title}"></p>
    </div>

    <div class="form-card" style="max-width: 680px;">
        <form th:action="${isNew} ? @{/admin/cycles/new} : @{/admin/cycles/{id}/edit(id=${cycle?.id})}"
              method="post"
              th:object="${cycleDto}">
            <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>

            <!-- Title -->
            <div class="form-group">
                <label class="form-label" th:text="#{cycle.form.label.title}">Title</label>
                <input type="text" th:field="*{title}"
                       th:class="${#fields.hasErrors('title')} ? 'form-control is-invalid' : 'form-control'"
                       placeholder="e.g. Strength Foundation — 8 Weeks" required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}"
                     th:errors="*{title}"></div>
            </div>

            <!-- Description -->
            <div class="form-group">
                <label class="form-label" th:text="#{cycle.form.label.description}">Description</label>
                <textarea th:field="*{description}"
                          th:class="${#fields.hasErrors('description')} ? 'form-textarea is-invalid' : 'form-textarea'"
                          rows="5"
                          placeholder="Describe the programme goals, structure and who it's suitable for..."
                          required></textarea>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}"
                     th:errors="*{description}"></div>
            </div>

            <!-- Duration + Price side by side -->
            <div class="row-2">
                <div class="form-group">
                    <label class="form-label" th:text="#{cycle.form.label.duration}">Duration (weeks)</label>
                    <input type="number" th:field="*{durationWeeks}"
                           th:class="${#fields.hasErrors('durationWeeks')} ? 'form-control is-invalid' : 'form-control'"
                           min="1" max="52" placeholder="8" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('durationWeeks')}"
                         th:errors="*{durationWeeks}"></div>
                </div>
                <div class="form-group">
                    <label class="form-label" th:text="#{cycle.form.label.price}">Price (₸)</label>
                    <input type="number" th:field="*{price}"
                           th:class="${#fields.hasErrors('price')} ? 'form-control is-invalid' : 'form-control'"
                           min="0" step="100" placeholder="49900" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('price')}"
                         th:errors="*{price}"></div>
                </div>
            </div>

            <!-- Actions -->
            <div class="form-actions" style="margin-top: 8px;">
                <button type="submit" class="btn btn--primary"
                        th:text="${isNew} ? #{cycle.form.submit.new} : #{cycle.form.submit.edit}">Save</button>
                <a th:href="@{/admin/cycles}" class="btn btn--outline" th:text="#{common.cancel}">Cancel</a>
            </div>

        </form>
    </div>

</div>

<footer th:replace="~{common/layout :: footer}"></footer>
</body>
</html>
