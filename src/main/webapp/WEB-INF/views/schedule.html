<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{schedule.title} + ' — FemFit'">Schedule — FemFit</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
        :root { --rose:#C4687A; --rose-light:#F5E8EA; --rose-mid:#E8B4BC; --rose-dark:#7A3040; --rose-deep:#3D1520; --sand:#F7F3EE; --warm-white:#FDFAF7; --charcoal:#2C2420; --muted:#8A7A72; --border:#E8DDD8; --serif:'Cormorant Garamond',Georgia,serif; --sans:'DM Sans',sans-serif; }
        body { font-family:var(--sans); background:var(--warm-white); color:var(--charcoal); font-size:15px; }
        nav.main-nav { position:sticky; top:0; z-index:100; background:rgba(253,250,247,0.95); backdrop-filter:blur(12px); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 40px; height:64px; gap:8px; }
        .logo { font-family:var(--serif); font-size:26px; font-weight:500; color:var(--rose-dark); letter-spacing:0.5px; margin-right:auto; text-decoration:none; }
        .logo span { color:var(--rose); }
        .nav-link { font-size:13px; color:var(--muted); padding:8px 16px; border-radius:30px; text-decoration:none; display:inline-block; transition:all 0.2s; }
        .nav-link:hover { color:var(--charcoal); background:var(--sand); }
        .nav-cta { margin-left:8px; padding:9px 22px; background:var(--rose); color:white; border:none; border-radius:30px; font-size:13px; font-weight:500; cursor:pointer; font-family:var(--sans); text-decoration:none; display:inline-block; }
        .nav-cta:hover { background:var(--rose-dark); color:white; }
        .lang-sw { display:flex; gap:2px; margin-left:12px; background:var(--sand); border-radius:20px; padding:3px; }
        .lang-btn { font-size:11px; padding:4px 10px; border-radius:16px; border:none; background:transparent; color:var(--muted); cursor:pointer; text-decoration:none; display:inline-block; }
        .section { padding:60px 40px; max-width:1200px; margin:0 auto; }
        .section-eyebrow { font-size:11px; font-weight:500; letter-spacing:3px; color:var(--rose); text-transform:uppercase; margin-bottom:12px; }
        .section-title { font-family:var(--serif); font-size:clamp(28px,4vw,42px); font-weight:400; color:var(--rose-deep); margin-bottom:32px; }
        .filter-bar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:24px; }
        .fpill { padding:7px 18px; border-radius:30px; font-size:13px; border:1px solid var(--border); background:white; color:var(--muted); cursor:pointer; transition:all 0.2s; font-family:var(--sans); text-decoration:none; display:inline-block; }
        .fpill:hover { border-color:var(--rose-mid); color:var(--rose-dark); }
        .fpill.active { background:var(--rose-light); border-color:var(--rose-mid); color:var(--rose-dark); font-weight:500; }
        .sched-table { background:white; border:1px solid var(--border); border-radius:20px; overflow:hidden; }
        .sched-head { display:grid; grid-template-columns:80px 1fr 130px 80px 100px; padding:14px 24px; background:var(--sand); font-size:11px; font-weight:500; color:var(--muted); letter-spacing:1px; text-transform:uppercase; gap:12px; }
        .sched-row { display:grid; grid-template-columns:80px 1fr 130px 80px 100px; padding:16px 24px; border-top:1px solid var(--border); align-items:center; gap:12px; font-size:14px; transition:background 0.15s; }
        .sched-row:hover { background:var(--sand); }
        .time-c { font-size:13px; color:var(--muted); }
        .class-n { font-weight:500; color:var(--charcoal); }
        .trainer-c { font-size:13px; color:var(--muted); }
        .spots-badge { display:inline-block; font-size:11px; padding:3px 10px; border-radius:12px; background:var(--rose-light); color:var(--rose-dark); font-weight:500; }
        .spots-badge.full { background:#F1EFE8; color:var(--muted); }
        .book-btn { padding:7px 16px; background:var(--rose); color:white; border:none; border-radius:20px; font-size:12px; font-weight:500; cursor:pointer; font-family:var(--sans); transition:all 0.2s; text-decoration:none; display:inline-block; white-space:nowrap; }
        .book-btn:hover { background:var(--rose-dark); color:white; }
        footer { background:var(--rose-deep); color:rgba(255,255,255,0.7); text-align:center; padding:32px 40px; font-size:13px; margin-top:80px; }
        footer .footer-logo { font-family:var(--serif); font-size:22px; color:white; margin-bottom:8px; }
        @media (max-width:768px) { .sched-head,.sched-row { grid-template-columns:70px 1fr 80px; } .sched-head span:nth-child(3),.sched-head span:nth-child(4),.sched-row>*:nth-child(3),.sched-row>*:nth-child(4) { display:none; } nav.main-nav { padding:0 16px; } }
    </style>
</head>
<body>
<nav th:replace="~{common/layout :: nav}"></nav>

<div class="section">
    <div class="section-eyebrow">Book your spot</div>
    <div class="section-title" th:text="#{schedule.title}">Class Schedule</div>
    <div class="filter-bar">
        <a th:href="@{/schedule}" th:class="${activeCategory == 'ALL'} ? 'fpill active' : 'fpill'" th:text="#{schedule.filter.all}">All</a>
        <a th:href="@{/schedule(category='CARDIO')}" th:class="${activeCategory == 'CARDIO'} ? 'fpill active' : 'fpill'" th:text="#{schedule.filter.cardio}">Cardio</a>
        <a th:href="@{/schedule(category='YOGA')}" th:class="${activeCategory == 'YOGA'} ? 'fpill active' : 'fpill'" th:text="#{schedule.filter.yoga}">Yoga</a>
        <a th:href="@{/schedule(category='STRENGTH')}" th:class="${activeCategory == 'STRENGTH'} ? 'fpill active' : 'fpill'" th:text="#{schedule.filter.strength}">Strength</a>
        <a th:href="@{/schedule(category='PILATES')}" th:class="${activeCategory == 'PILATES'} ? 'fpill active' : 'fpill'" th:text="#{schedule.filter.pilates}">Pilates</a>
        <a th:href="@{/schedule(category='DANCE')}" th:class="${activeCategory == 'DANCE'} ? 'fpill active' : 'fpill'" th:text="#{schedule.filter.dance}">Dance</a>
    </div>
    <div class="sched-table">
        <div class="sched-head">
            <span th:text="#{schedule.col.time}">Time</span>
            <span th:text="#{schedule.col.class}">Class</span>
            <span th:text="#{schedule.col.trainer}">Trainer</span>
            <span th:text="#{schedule.col.spots}">Spots</span>
            <span></span>
        </div>
        <div th:if="${#lists.isEmpty(schedules)}" style="padding:32px;text-align:center;color:var(--muted);font-size:14px;" th:text="#{schedule.no.classes}">No classes found</div>
        <div th:each="s : ${schedules}" class="sched-row">
            <span class="time-c" th:text="${#temporals.format(s.scheduledAt,'HH:mm')}">07:00</span>
            <span class="class-n" th:text="${s.className}">Morning Yoga</span>
            <span class="trainer-c" th:text="${s.trainerName}">Elena M.</span>
            <span th:class="${s.spotsLeft == 0} ? 'spots-badge full' : 'spots-badge'"
                  th:text="${s.spotsLeft == 0} ? #{schedule.full} : ${s.spotsLeft} + ' left'">3 left</span>
            <div>
                <th:block th:if="${isAuthenticated and s.spotsLeft > 0}">
                    <form th:action="@{/client/book/{id}(id=${s.id})}" method="post" style="display:inline;">
                        <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>
                        <button type="submit" class="book-btn" th:text="#{schedule.book}">Book</button>
                    </form>
                </th:block>
                <th:block th:if="${isAuthenticated and s.spotsLeft == 0}">
                    <span style="font-size:12px;color:var(--muted);" th:text="#{schedule.full}">Full</span>
                </th:block>
                <th:block th:unless="${isAuthenticated}">
                    <a th:href="@{/auth/login}" class="book-btn" th:text="#{schedule.book}">Book</a>
                </th:block>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{common/layout :: footer}"></footer>
</body>
</html>
