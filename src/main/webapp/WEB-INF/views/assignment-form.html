<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{trainer.assignment.form.title}">Assignment Form</title>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container container--narrow">

    <div class="form-header">
        <h1 class="page-title"
            th:text="${editMode} ? #{trainer.assignment.edit} : #{trainer.assignment.create}">
            Assignment
        </h1>
        <a class="btn btn--ghost"
           th:href="@{/trainer/dashboard}"
           th:text="#{common.back}">← Back</a>
    </div>

    <div th:if="${successMsg}" class="alert alert--success" th:text="${successMsg}"></div>
    <div th:if="${errorMsg}"   class="alert alert--error"   th:text="${errorMsg}"></div>

    <!--
      POST /trainer/assignment/save
      Все поля — через name="...", значения — через th:value="${assignment.field}"
      th:object не используем — Assignment не содержит clientId/trainerId
    -->
    <form th:action="@{/trainer/assignment/save}"
          method="post"
          class="form-card">

        <input type="hidden" name="clientId"
               th:value="${clientId}"/>
        <input type="hidden" name="orderId"
               th:value="${orderId}"/>
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}"/>

        <div class="form-group">
            <label class="form-label" for="exercises"
                   th:text="#{trainer.assignment.exercises}">Exercises</label>
            <textarea class="form-textarea"
                      id="exercises"
                      name="exercises"
                      rows="6"
                      th:placeholder="#{trainer.assignment.exercises.placeholder}"
                      th:text="${assignment?.exercises}"></textarea>
        </div>

        <div class="form-group">
            <label class="form-label" for="equipment"
                   th:text="#{trainer.assignment.equipment}">Equipment</label>
            <textarea class="form-textarea"
                      id="equipment"
                      name="equipment"
                      rows="4"
                      th:placeholder="#{trainer.assignment.equipment.placeholder}"
                      th:text="${assignment?.equipment}"></textarea>
        </div>

        <div class="form-group">
            <label class="form-label" for="nutritionPlan"
                   th:text="#{trainer.assignment.nutrition}">Nutrition Plan</label>
            <textarea class="form-textarea"
                      id="nutritionPlan"
                      name="nutritionPlan"
                      rows="6"
                      th:placeholder="#{trainer.assignment.nutrition.placeholder}"
                      th:text="${assignment?.nutritionPlan}"></textarea>
        </div>

        <div class="form-group">
            <label class="form-label" for="scheduleInfo"
                   th:text="#{trainer.assignment.schedule}">Schedule</label>
            <textarea class="form-textarea"
                      id="scheduleInfo"
                      name="scheduleInfo"
                      rows="4"
                      th:placeholder="#{trainer.assignment.schedule.placeholder}"
                      th:text="${assignment?.scheduleInfo}"></textarea>
        </div>

        <div class="form-actions">
            <a class="btn btn--ghost"
               th:href="@{/trainer/dashboard}"
               th:text="#{common.cancel}">Cancel</a>
            <button type="submit" class="btn btn--primary"
                    th:text="#{common.save}">Save</button>
        </div>
    </form>

    <!--
      Блок смены статуса — только в edit mode и если assignment существует
    -->
    <div th:if="${editMode and assignment?.id != null}"
         class="form-card form-card--secondary">

        <h2 class="section-title" th:text="#{trainer.assignment.status.title}">Status</h2>

        <form th:action="@{/trainer/assignment/{id}/status(id=${assignment.id})}"
              method="post"
              class="status-form">
            <input type="hidden" name="clientId" th:value="${clientId}"/>
            <input type="hidden" name="orderId"  th:value="${orderId}"/>
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}"/>

            <select class="form-select" name="status">
                <option value="ACTIVE"
                        th:selected="${assignment.status == 'ACTIVE'}"
                        th:text="#{assignment.status.active}">Active</option>
                <option value="COMPLETED"
                        th:selected="${assignment.status == 'COMPLETED'}"
                        th:text="#{assignment.status.completed}">Completed</option>
                <option value="REVISION_REQUESTED"
                        th:selected="${assignment.status == 'REVISION_REQUESTED'}"
                        th:text="#{assignment.status.revision}">Revision Requested</option>
            </select>

            <button type="submit" class="btn btn--secondary btn--sm"
                    th:text="#{trainer.assignment.status.update}">Update Status</button>
        </form>
    </div>

    <!--
      Удаление — только если assignment уже сохранён (id > 0)
    -->
    <div th:if="${editMode and assignment?.id != null}"
         class="delete-zone">
        <form th:action="@{/trainer/assignment/delete}"
              method="post">
            <input type="hidden" name="orderId"  th:value="${orderId}"/>
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}"/>
            <button type="submit"
                    class="btn btn--danger btn--sm"
                    th:text="#{trainer.assignment.delete}"
                    onclick="return confirm([[#{trainer.assignment.delete.confirm}]])">
                Delete
            </button>
        </form>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
