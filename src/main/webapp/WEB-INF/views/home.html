<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/layout :: head}">
  <title>Home — FemFit</title>
</head>
<body>
<nav th:replace="~{common/layout :: nav}"></nav>

<main>
  <!-- HERO -->
  <div class="hero">
    <div>
      <div class="hero-eyebrow">Premium Women's Fitness</div>
      <h1 class="hero-h1">
        Your strength.<br><em>Your space.</em>
      </h1>
      <p class="hero-sub">
        A luxury fitness club designed exclusively for women — where wellness meets elegance.
      </p>
      <div class="hero-btns">
        <a th:href="@{/plans}" class="btn-primary" th:text="#{home.cta.membership}">Choose your membership</a>
        <a th:href="@{/schedule}" class="btn-outline" th:text="#{nav.schedule}">Schedule</a>
      </div>
    </div>
    <div class="hero-visual">
      <div class="hero-card-big">
        <div style="font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;">Next class</div>
        <div style="font-family:var(--serif);font-size:22px;color:var(--rose-deep);margin-bottom:4px;">Morning Yoga</div>
        <div style="font-size:13px;color:var(--muted);margin-bottom:16px;">07:00 · Studio A · Elena M.</div>
        <div style="height:1px;background:var(--border);margin-bottom:16px;width:100%;"></div>
        <div style="font-size:28px;font-family:var(--serif);color:var(--rose);">2,400+</div>
        <div style="font-size:12px;color:var(--muted);">Active members</div>
      </div>
    </div>
  </div>

  <!-- OUR CLASSES -->
  <div class="section">
    <div class="section-eyebrow" th:text="#{home.classes.eyebrow}">What we offer</div>
    <h2 class="section-title" th:text="#{home.classes.title}">Our classes</h2>
    <div class="class-grid">
      <a th:each="cat : ${ {'CARDIO','YOGA','STRENGTH','PILATES','DANCE','STRETCHING'} }"
         th:href="@{/schedule(category=${cat})}" class="class-card">
        <div class="class-line"></div>
        <div class="class-name" th:text="${cat}">YOGA</div>
      </a>
    </div>
  </div>
</main>

<footer th:replace="~{common/layout :: footer}"></footer>
</body>
</html>
