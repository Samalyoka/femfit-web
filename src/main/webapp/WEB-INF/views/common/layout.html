<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FemFit</title>
  <link rel="stylesheet" th:href="@{/static/css/main.css}">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

<script>
  const params = new URLSearchParams(window.location.search);
  const lang = params.get('lang');
  if (lang) {
    document.querySelectorAll('.lang-btn').forEach(btn => {
      const href = btn.getAttribute('href');
      if (href && href.includes('lang=' + lang)) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    });
  }
</script>

<nav th:fragment="nav" class="main-nav">
  <a class="logo" th:href="@{/home}">Fem<span>Fit</span></a>
  <a class="nav-link" th:href="@{/home}" th:text="#{nav.home}">Home</a>
  <a class="nav-link" th:href="@{/schedule}" th:text="#{nav.schedule}">Schedule</a>
  <a class="nav-link" th:href="@{/plans}" th:text="#{nav.membership}">Membership</a>
  <a class="nav-link" th:if="${userRole == 'CLIENT'}" th:href="@{/client/profile}" th:text="#{nav.profile}">My Profile</a>
  <a class="nav-link" th:if="${userRole == 'CLIENT'}" th:href="@{/client/cycles}" th:text="#{nav.cycles}">Programs</a>
  <a class="nav-link" th:if="${userRole == 'TRAINER'}" th:href="@{/trainer/dashboard}" th:text="#{nav.trainer}">Trainer Panel</a>
  <a class="nav-link" th:if="${userRole == 'ADMIN'}" th:href="@{/admin/dashboard}" th:text="#{nav.admin}">Admin Panel</a>
  <div class="lang-sw">
    <a th:href="@{''(lang=en)}" class="lang-btn"
       th:classappend="${#locale.language == 'en' or #locale.language == 'en_US'} ? ' active' : ''">EN</a>
    <a th:href="@{''(lang=ru)}" class="lang-btn"
       th:classappend="${#locale.language == 'ru'} ? ' active' : ''">RU</a>
    <a th:href="@{''(lang=kz)}" class="lang-btn"
       th:classappend="${#locale.language == 'kz'} ? ' active' : ''">KZ</a>
  </div>
  <th:block th:if="${isAuthenticated}">
    <form th:action="@{/auth/logout}" method="post" style="display:inline;margin-left:8px;">
      <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>
      <button type="submit" class="nav-cta" th:text="#{nav.logout}">Log Out</button>
    </form>
  </th:block>
  <th:block th:unless="${isAuthenticated}">
    <a class="nav-link" th:href="@{/auth/login}" th:text="#{nav.login}">Log In</a>
    <a class="nav-cta" th:href="@{/auth/register}" th:text="#{nav.register}">Join Now</a>
  </th:block>
</nav>

<footer th:fragment="footer">
  <div class="footer-logo">FemFit</div>
  <div>© 2026 FemFit Women's Fitness Club. All rights reserved.</div>
</footer>

</body>
</html>
