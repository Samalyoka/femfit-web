<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<head th:replace="~{common/layout :: head}">
    <title>Assignment Form</title>
</head>
<body>

<nav th:replace="~{common/layout :: nav}"></nav>

<section class="page-section">
    <div class="container" style="max-width: 760px;">

        <div class="page-header">
            <a class="back-link"
               th:href="@{/trainer/dashboard}"
               th:text="#{common.back}">← Back</a>
            <h1 class="section-title"
                th:text="${editMode} ? #{trainer.assignment.edit} : #{trainer.assignment.create}">
                Assignment
            </h1>
        </div>

        <!-- Client info bar -->
        <div class="assignment-order-bar" th:if="${order != null}" style="margin-bottom: 28px;">
            <div class="assignment-order-item">
                <span class="assignment-order-label">Client</span>
                <span class="assignment-order-value" th:text="${order.clientName}">—</span>
            </div>
            <div class="assignment-order-item">
                <span class="assignment-order-label">Programme</span>
                <span class="assignment-order-value" th:text="${order.cycleTitle}">—</span>
            </div>
            <div class="assignment-order-item">
                <span class="assignment-order-label">Started</span>
                <span class="assignment-order-value"
                      th:text="${#temporals.format(order.createdAt,'d MMM yyyy')}">—</span>
            </div>
            <div class="assignment-order-item">
                <span class="assignment-order-label">Status</span>
                <span th:class="'order-status status-' + ${order.status.toLowerCase()}"
                      th:text="${order.status}">ACTIVE</span>
            </div>
        </div>

        <!-- Flash messages -->
        <div th:if="${successMsg}" class="alert alert--success" th:text="${successMsg}"></div>
        <div th:if="${errorMsg}"   class="alert alert--error"   th:text="${errorMsg}"></div>

        <!-- Main form -->
        <form th:action="@{/trainer/assignment/save}"
              method="post"
              class="form-card">

            <input type="hidden" name="clientId"  th:value="${clientId}"/>
            <input type="hidden" name="orderId"   th:value="${orderId}"/>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group">
                <label class="form-label" for="exercises"
                       th:text="#{trainer.assignment.exercises}">Exercise Plan</label>
                <textarea class="form-textarea"
                          id="exercises"
                          name="exercises"
                          rows="6"
                          th:placeholder="#{trainer.assignment.exercises.placeholder}"
                          th:text="${assignment?.exercises}"></textarea>
            </div>

            <div class="form-group">
                <label class="form-label" for="equipment"
                       th:text="#{trainer.assignment.equipment}">Equipment</label>
                <textarea class="form-textarea"
                          id="equipment"
                          name="equipment"
                          rows="4"
                          th:placeholder="#{trainer.assignment.equipment.placeholder}"
                          th:text="${assignment?.equipment}"></textarea>
            </div>

            <div class="form-group">
                <label class="form-label" for="nutritionPlan"
                       th:text="#{trainer.assignment.nutrition}">Nutrition Plan</label>
                <textarea class="form-textarea"
                          id="nutritionPlan"
                          name="nutritionPlan"
                          rows="6"
                          th:placeholder="#{trainer.assignment.nutrition.placeholder}"
                          th:text="${assignment?.nutritionPlan}"></textarea>
            </div>

            <div class="form-group">
                <label class="form-label" for="scheduleInfo"
                       th:text="#{trainer.assignment.schedule}">Schedule</label>
                <textarea class="form-textarea"
                          id="scheduleInfo"
                          name="scheduleInfo"
                          rows="4"
                          th:placeholder="#{trainer.assignment.schedule.placeholder}"
                          th:text="${assignment?.scheduleInfo}"></textarea>
            </div>

            <div class="form-actions">
                <a class="btn btn--outline"
                   th:href="@{/trainer/dashboard}"
                   th:text="#{common.cancel}">Cancel</a>
                <button type="submit" class="btn btn--primary"
                        th:text="#{common.save}">Save</button>
            </div>

        </form>

        <!-- Status update — edit mode only -->
        <div th:if="${editMode and assignment?.id != null}" class="form-card" style="margin-top: 24px;">
            <h2 class="section-sub" th:text="#{trainer.assignment.status.title}">Status</h2>

            <form th:action="@{/trainer/assignment/{id}/status(id=${assignment.id})}"
                  method="post"
                  style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
                <input type="hidden" name="clientId" th:value="${clientId}"/>
                <input type="hidden" name="orderId"  th:value="${orderId}"/>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <select class="form-select" name="status">
                    <option value="ACTIVE"
                            th:selected="${assignment.status == 'ACTIVE'}"
                            th:text="#{assignment.status.active}">Active</option>
                    <option value="COMPLETED"
                            th:selected="${assignment.status == 'COMPLETED'}"
                            th:text="#{assignment.status.completed}">Completed</option>
                    <option value="REVISION_REQUESTED"
                            th:selected="${assignment.status == 'REVISION_REQUESTED'}"
                            th:text="#{assignment.status.revision}">Revision Requested</option>
                </select>

                <button type="submit" class="btn btn--outline"
                        th:text="#{trainer.assignment.status.update}">Update</button>
            </form>
        </div>

        <!-- Delete — edit mode only -->
        <div th:if="${editMode and assignment?.id != null}" class="form-card" style="margin-top: 16px;">
            <form th:action="@{/trainer/assignment/delete}" method="post">
                <input type="hidden" name="orderId" th:value="${orderId}"/>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit"
                        class="btn btn--danger"
                        th:text="#{trainer.assignment.delete}"
                        onclick="return confirm(this.dataset.confirm)"
                        th:attr="data-confirm=#{trainer.assignment.delete.confirm}">
                    Delete Assignment
                </button>
            </form>
        </div>

    </div>
</section>

<footer th:replace="~{common/layout :: footer}"></footer>
</body>
</html>
