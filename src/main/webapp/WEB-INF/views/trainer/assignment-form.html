<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Assignment — FemFit</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{common/layout :: nav}"></nav>

<div class="container py-5" style="max-width:700px;">
    <a th:href="@{/trainer/dashboard}" class="back-link">← Back to dashboard</a>

    <h1 class="section-title" style="margin:16px 0 8px;">Training Assignment</h1>
    <p class="section-sub" style="margin-bottom:32px;" th:text="'Client: ' + ${order?.clientName} + ' · ' + ${order?.cycleTitle}"></p>

    <form th:action="@{/trainer/assignment/save}" method="post" th:object="${assignment}">
        <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>
        <input type="hidden" th:field="*{id}"/>
        <input type="hidden" th:field="*{orderId}"/>

        <div class="mb-4">
            <label class="form-label" th:text="#{client.assignment.exercises}">Exercises</label>
            <textarea th:field="*{exercises}" class="form-control" rows="5" placeholder="e.g. 3x12 squats..."></textarea>
        </div>
        <div class="mb-4">
            <label class="form-label" th:text="#{client.assignment.equipment}">Required equipment</label>
            <textarea th:field="*{equipment}" class="form-control" rows="3" placeholder="e.g. Resistance bands..."></textarea>
        </div>
        <div class="mb-4">
            <label class="form-label" th:text="#{client.assignment.nutrition}">Nutrition plan</label>
            <textarea th:field="*{nutritionPlan}" class="form-control" rows="4" placeholder="e.g. High protein diet..."></textarea>
        </div>
        <div class="mb-4">
            <label class="form-label">Training schedule</label>
            <textarea th:field="*{scheduleInfo}" class="form-control" rows="3" placeholder="e.g. Mon/Wed/Fri..."></textarea>
        </div>

        <div class="d-flex gap-3">
            <button type="submit" class="btn-primary" th:text="#{btn.save}">Save</button>
            <a th:href="@{/trainer/dashboard}" class="btn-outline" th:text="#{btn.cancel}">Cancel</a>
        </div>
    </form>
</div>

<footer th:replace="~{common/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
