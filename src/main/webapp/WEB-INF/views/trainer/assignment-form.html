<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <title>Assignment — FemFit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root{--rose:#C4687A;--rose-light:#F5E8EA;--rose-dark:#7A3040;--border:#E8DDD8;--serif:'Cormorant Garamond',serif;}
        body{font-family:'DM Sans',sans-serif;background:#FDFAF7;color:#2C2420;}
        .form-label{font-size:12px;font-weight:500;color:#8A7A72;letter-spacing:0.5px;text-transform:uppercase;}
        .form-control{border:0.5px solid var(--border);border-radius:8px;font-size:14px;}
        .form-control:focus{border-color:var(--rose);box-shadow:0 0 0 3px rgba(196,104,122,0.1);}
        .btn-rose{padding:10px 24px;background:var(--rose);color:white;border:none;border-radius:30px;font-size:14px;font-weight:500;cursor:pointer;}
        .btn-rose:hover{background:var(--rose-dark);}
    </style>
</head>
<body>
<nav th:replace="~{common/layout :: nav}"></nav>

<div class="container py-5" style="max-width:700px;">
    <a th:href="@{/trainer/dashboard}" style="font-size:13px;color:#8A7A72;text-decoration:none;">← Back to dashboard</a>
    <h1 style="font-family:var(--serif);font-size:32px;font-weight:400;color:#3D1520;margin:16px 0 8px;">Training Assignment</h1>
    <p style="color:#8A7A72;margin-bottom:32px;" th:text="'Client: ' + ${order?.clientName} + ' · ' + ${order?.cycleTitle}">Client: Anna Kim</p>

    <form th:action="@{/trainer/assignment/save}" method="post" th:object="${assignment}">
        <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>
        <input type="hidden" th:field="*{id}"/>
        <input type="hidden" th:field="*{orderId}"/>

        <div class="mb-4">
            <label class="form-label" th:text="#{client.assignment.exercises}">Exercises</label>
            <textarea th:field="*{exercises}" class="form-control" rows="5"
                      placeholder="e.g. 3x12 squats, 3x15 lunges..."></textarea>
        </div>
        <div class="mb-4">
            <label class="form-label" th:text="#{client.assignment.equipment}">Required equipment</label>
            <textarea th:field="*{equipment}" class="form-control" rows="3"
                      placeholder="e.g. Resistance bands, dumbbells..."></textarea>
        </div>
        <div class="mb-4">
            <label class="form-label" th:text="#{client.assignment.nutrition}">Nutrition plan</label>
            <textarea th:field="*{nutritionPlan}" class="form-control" rows="4"
                      placeholder="e.g. High protein diet, 2000 kcal/day..."></textarea>
        </div>
        <div class="mb-4">
            <label class="form-label">Training schedule</label>
            <textarea th:field="*{scheduleInfo}" class="form-control" rows="3"
                      placeholder="e.g. Mon/Wed/Fri — strength..."></textarea>
        </div>
        <div class="d-flex gap-3">
            <button type="submit" class="btn-rose" th:text="#{btn.save}">Save</button>
            <a th:href="@{/trainer/dashboard}" class="btn btn-outline-secondary" style="border-radius:30px;" th:text="#{btn.cancel}">Cancel</a>
        </div>
    </form>
</div>

<footer th:replace="~{common/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
