<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<head th:replace="~{common/layout :: head}">
    <title>Assignment</title>
</head>
<body>

<nav th:replace="~{common/layout :: nav}"></nav>

<section class="page-section">
    <div class="container" style="max-width: 760px;">

        <div class="page-header">
            <a class="back-link"
               th:href="@{/trainer/dashboard}"
               th:text="#{common.back}">← Back</a>
            <h1 class="section-title" th:text="#{trainer.assignment.view.title}">Assignment</h1>
        </div>

        <!-- Client info bar -->
        <div class="assignment-order-bar" th:if="${order != null}" style="margin-bottom: 28px;">
            <div class="assignment-order-item">
                <span class="assignment-order-label">Client</span>
                <span class="assignment-order-value" th:text="${order.clientName}">—</span>
            </div>
            <div class="assignment-order-item">
                <span class="assignment-order-label">Programme</span>
                <span class="assignment-order-value" th:text="${order.cycleTitle}">—</span>
            </div>
            <div class="assignment-order-item">
                <span class="assignment-order-label">Started</span>
                <span class="assignment-order-value"
                      th:text="${#temporals.format(order.createdAt,'d MMM yyyy')}">—</span>
            </div>
            <div class="assignment-order-item">
                <span class="assignment-order-label">Status</span>
                <span th:class="'order-status status-' + ${order.status.toLowerCase()}"
                      th:text="${order.status}">ACTIVE</span>
            </div>
        </div>

        <!-- No assignment yet -->
        <div th:if="${!hasAssignment}" class="assignment-empty">
            <div class="assignment-empty__icon">
                <svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
                    <rect x="15" y="10" width="50" height="60" rx="6" fill="var(--rose-light)" stroke="var(--rose)" stroke-width="2"/>
                    <line x1="25" y1="28" x2="55" y2="28" stroke="var(--rose-mid)" stroke-width="2" stroke-linecap="round"/>
                    <line x1="25" y1="36" x2="55" y2="36" stroke="var(--rose-mid)" stroke-width="2" stroke-linecap="round"/>
                    <line x1="25" y1="44" x2="45" y2="44" stroke="var(--rose-mid)" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>
            <p class="assignment-empty__desc" th:text="#{trainer.assignment.view.no.assignment}">
                No assignment created yet.
            </p>
            <a class="btn btn--primary"
               th:href="@{/trainer/client/{cid}/assignment/form(cid=${clientId}, orderId=${orderId})}"
               th:text="#{trainer.assignment.create}">Create Assignment</a>
        </div>

        <!-- Assignment content -->
        <div th:if="${hasAssignment}" class="form-card">

            <!-- Status badge -->
            <div style="margin-bottom: 24px;">
                <span class="badge"
                      th:classappend="${assignment.status == 'ACTIVE'}    ? ' badge--active'
                                    : (${assignment.status == 'COMPLETED'} ? ' badge--success'
                                    : ' badge--warning')"
                      th:text="${assignment.status}">ACTIVE</span>
            </div>

            <!-- Client's revision comment, if any was provided -->
            <div th:if="${assignment.status == 'REVISION_REQUESTED' and assignment.revisionComment != null and !assignment.revisionComment.isBlank()}"
                 class="alert" style="background: var(--sand); margin-bottom: 24px;">
                <strong th:text="#{trainer.assignment.view.revision.comment.label}">Client's note:</strong>
                <span th:text="${assignment.revisionComment}"></span>
            </div>

            <div class="form-group">
                <label class="form-label" th:text="#{trainer.assignment.view.exercises}">Exercises</label>
                <span th:if="${assignment.revisionExercisesRequested}"
                      class="badge badge--warning" style="margin-left: 8px; font-size: 11px;"
                      th:text="#{trainer.assignment.view.revision.flag}">Revision requested</span>
                <div class="assignment-text" th:text="${assignment.exercises}">—</div>
            </div>

            <div class="form-group">
                <label class="form-label" th:text="#{trainer.assignment.view.equipment}">Equipment</label>
                <span th:if="${assignment.revisionEquipmentRequested}"
                      class="badge badge--warning" style="margin-left: 8px; font-size: 11px;"
                      th:text="#{trainer.assignment.view.revision.flag}">Revision requested</span>
                <div class="assignment-text" th:text="${assignment.equipment}">—</div>
            </div>

            <div class="form-group">
                <label class="form-label" th:text="#{trainer.assignment.view.nutrition}">Nutrition Plan</label>
                <span th:if="${assignment.revisionNutritionRequested}"
                      class="badge badge--warning" style="margin-left: 8px; font-size: 11px;"
                      th:text="#{trainer.assignment.view.revision.flag}">Revision requested</span>
                <div class="assignment-text" th:text="${assignment.nutritionPlan}">—</div>
            </div>

            <div class="form-group">
                <label class="form-label" th:text="#{trainer.assignment.view.schedule}">Schedule</label>
                <span th:if="${assignment.revisionScheduleRequested}"
                      class="badge badge--warning" style="margin-left: 8px; font-size: 11px;"
                      th:text="#{trainer.assignment.view.revision.flag}">Revision requested</span>
                <div class="assignment-text" th:text="${assignment.scheduleInfo}">—</div>
            </div>

            <div class="form-actions">
                <a class="btn btn--primary"
                   th:href="@{/trainer/client/{cid}/assignment/form(cid=${clientId}, orderId=${orderId})}"
                   th:text="#{trainer.assignment.edit}">Edit Assignment</a>
            </div>

        </div>

    </div>
</section>

<footer th:replace="~{common/layout :: footer}"></footer>
</body>
</html>
