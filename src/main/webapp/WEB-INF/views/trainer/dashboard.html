<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <title>Trainer Dashboard — FemFit</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root{--rose:#C4687A;--rose-light:#F5E8EA;--rose-dark:#7A3040;--border:#E8DDD8;--serif:'Cormorant Garamond',serif;}
    body{font-family:'DM Sans',sans-serif;background:#FDFAF7;color:#2C2420;}
    .card-f{background:white;border:0.5px solid var(--border);border-radius:12px;padding:20px 24px;margin-bottom:14px;}
    .status-badge{font-size:11px;padding:3px 10px;border-radius:12px;font-weight:500;}
    .status-PENDING{background:#FFF3E0;color:#E65100;}
    .status-ACTIVE{background:#E8F5EE;color:#2E7D52;}
    .status-COMPLETED{background:#F1EFE8;color:#8A7A72;}
    .btn-rose{padding:8px 18px;background:var(--rose);color:white;border:none;border-radius:20px;font-size:13px;cursor:pointer;text-decoration:none;display:inline-block;}
    .btn-rose:hover{background:var(--rose-dark);color:white;}
  </style>
</head>
<body>
<nav th:replace="~{common/layout :: nav}"></nav>

<div class="container py-5">
  <p style="font-size:11px;letter-spacing:3px;color:#C4687A;text-transform:uppercase;margin-bottom:10px;">Trainer Panel</p>
  <h1 style="font-family:var(--serif);font-size:36px;font-weight:400;color:#3D1520;margin-bottom:8px;">
    Welcome, <span th:text="${trainer.firstName}">Elena</span>
  </h1>
  <p style="color:#8A7A72;margin-bottom:32px;">Manage your clients and training assignments below.</p>

  <div class="alert" style="background:#E8F5EE;color:#2E7D52;border:none;" th:if="${success}" th:text="${success}"></div>

  <h2 style="font-family:var(--serif);font-size:24px;font-weight:400;margin-bottom:20px;">Active Client Orders</h2>

  <div th:if="${#lists.isEmpty(orders)}" style="font-size:14px;color:#8A7A72;padding:24px 0;">No active orders assigned to you.</div>

  <div th:each="o : ${orders}" class="card-f">
    <div class="d-flex justify-content-between align-items-start">
      <div>
        <div style="font-weight:500;font-size:16px;margin-bottom:4px;" th:text="${o.clientName}">Anna Kim</div>
        <div style="font-size:13px;color:#8A7A72;margin-bottom:8px;" th:text="${o.cycleTitle}">Beginner Body Reset</div>
        <span th:class="'status-badge status-' + ${o.status}" th:text="${o.status}">ACTIVE</span>
        <span style="font-size:12px;color:#8A7A72;margin-left:10px;" th:text="'Started: ' + ${#temporals.format(o.createdAt,'d MMM yyyy')}">Started: 1 Jun 2026</span>
      </div>
      <div class="d-flex gap-2">
        <a th:href="@{/trainer/assignment/{id}(id=${o.id})}" class="btn-rose" th:text="#{trainer.assignment.create}">Create Assignment</a>
        <form th:action="@{/trainer/order/complete/{id}(id=${o.id})}" method="post" th:if="${o.status == 'ACTIVE'}">
          <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>
          <button type="submit" class="btn btn-outline-secondary" style="border-radius:20px;font-size:13px;" th:text="#{trainer.assignment.complete}">Mark Completed</button>
        </form>
      </div>
    </div>
  </div>
</div>

<footer th:replace="~{common/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
