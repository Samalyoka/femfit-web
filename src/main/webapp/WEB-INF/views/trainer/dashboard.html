<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<head th:replace="~{common/layout :: head}">
    <title>Trainer Dashboard</title>
</head>
<body>

<nav th:replace="~{common/layout :: nav}"></nav>

<section class="page-section">
    <div class="container">

        <div class="profile-section-card" style="margin-bottom: 32px; display: flex; align-items: center; gap: 20px; padding: 20px 28px;">
            <div class="profile-avatar" style="width: 56px; height: 56px; font-size: 22px; flex-shrink: 0; margin: 0;">
                <span th:text="${#strings.substring(trainer.firstName, 0, 1)}">E</span>
            </div>
            <div>
                <div style="font-family: var(--serif); font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 4px;" th:text="#{trainer.panel}">Trainer Panel</div>
                <div style="font-family: var(--serif); font-size: 22px; color: var(--charcoal);"
                     th:text="${trainer.firstName} + ' ' + ${trainer.lastName}">Elena Morozova</div>
                <div style="font-family: var(--serif); font-size: 14px; color: var(--muted);"
                     th:text="${trainer.email}">elena@femfit.kz</div>
            </div>
        </div>

        <div class="page-header">
            <h1 class="section-title" th:text="#{trainer.dashboard.title}">Trainer Dashboard</h1>
        </div>

        <!-- Flash messages -->
        <div th:if="${successMsg}" class="alert alert--success" th:text="#{${successMsg}}"></div>
        <div th:if="${errorMsg}"   class="alert alert--error"   th:text="${errorMsg}"></div>

        <!-- Empty state -->
        <div th:if="${clients.empty}" class="empty-state">
            <p class="section-sub" th:text="#{trainer.no.clients}">No active clients assigned yet.</p>
        </div>

        <!-- Client cards -->
        <div class="cards-grid" th:unless="${clients.empty}">
            <div class="card" th:each="client : ${clients}">

                <div class="card__body">
                    <h3 class="card__title" th:text="${client.fullName}">Client Name</h3>
                    <p class="card__meta" th:text="${client.email}">email@example.com</p>
                    <span class="badge"
                          th:text="${client.orderStatus == 'ACTIVE'} ? #{order.status.active} : (${client.orderStatus == 'COMPLETED'} ? #{order.status.completed} : (${client.orderStatus == 'CANCELLED'} ? #{order.status.cancelled} : #{order.status.pending}))"
                          th:classappend="${client.orderStatus == 'ACTIVE'} ? ' badge--active' : ' badge--progress'">
                        ACTIVE
                    </span>
                </div>

                <div class="card__actions">
                    <a class="btn btn--outline"
                       th:href="@{/trainer/client/{cid}/assignment(cid=${client.clientId},
                                                                   orderId=${client.orderId})}"
                       th:text="#{trainer.assignment.view}">View Assignment</a>
                    <a class="btn btn--primary"
                       th:href="@{/trainer/client/{cid}/assignment/form(cid=${client.clientId},
                                                                        orderId=${client.orderId})}"
                       th:text="#{trainer.assignment.edit}">Edit Assignment</a>
                </div>

            </div>
        </div>

    </div>
</section>

<footer th:replace="~{common/layout :: footer}"></footer>
</body>
</html>.
