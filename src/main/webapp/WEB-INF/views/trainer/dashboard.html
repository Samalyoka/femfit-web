<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <title>Trainer Dashboard — FemFit</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{common/layout :: nav}"></nav>

<div class="container py-5">
  <p class="section-eyebrow">Trainer Panel</p>
  <h1 class="section-title" style="margin-bottom:8px;">
    Welcome, <span th:text="${trainer.firstName}">Elena</span>
  </h1>
  <p style="color:var(--muted); margin-bottom:32px;">Manage your clients and training assignments below.</p>

  <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>

  <h2 class="section-title" style="font-size:24px; margin-bottom:20px;">Active Client Orders</h2>

  <div th:if="${#lists.isEmpty(orders)}" style="font-size:14px; color:var(--muted); padding:24px 0;">
    No active orders assigned to you.
  </div>

  <div th:each="o : ${orders}" class="card-femfit mb-3">
    <div class="d-flex justify-content-between align-items-start">
      <div>
        <div style="font-weight:500; font-size:16px; margin-bottom:4px;" th:text="${o.clientName}"></div>
        <div style="font-size:13px; color:var(--muted); margin-bottom:8px;" th:text="${o.cycleTitle}"></div>
        <span th:class="'status-badge status-' + ${o.status}" th:text="${o.status}"></span>
        <span style="font-size:12px; color:var(--muted); margin-left:10px;" th:text="'Started: ' + ${#temporals.format(o.createdAt,'d MMM yyyy')}"></span>
      </div>
      <div class="d-flex gap-2">
        <a th:href="@{/trainer/assignment/{id}(id=${o.id})}" class="btn-primary" th:text="#{trainer.assignment.create}"></a>
        <form th:action="@{/trainer/order/complete/{id}(id=${o.id})}" method="post" th:if="${o.status == 'ACTIVE'}">
          <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>
          <button type="submit" class="btn-outline" style="border-radius:20px; font-size:13px;" th:text="#{trainer.assignment.complete}"></button>
        </form>
      </div>
    </div>
  </div>
</div>

<footer th:replace="~{common/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
