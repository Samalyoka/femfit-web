<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — FemFit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root{--rose:#C4687A;--rose-light:#F5E8EA;--rose-dark:#7A3040;--border:#E8DDD8;--serif:'Cormorant Garamond',serif;}
        body{font-family:'DM Sans',sans-serif;background:#FDFAF7;min-height:100vh;display:flex;flex-direction:column;}
        .top-nav{padding:16px 32px;border-bottom:0.5px solid var(--border);background:white;display:flex;align-items:center;}
        .auth-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 16px;}
        .auth-card{background:white;border:0.5px solid var(--border);border-radius:16px;padding:40px;max-width:480px;width:100%;}
        .auth-title{font-family:var(--serif);font-size:28px;font-weight:400;color:var(--rose-dark);margin-bottom:6px;}
        .auth-sub{font-size:13px;color:#8A7A72;margin-bottom:28px;}
        .form-label{font-size:12px;font-weight:500;color:#8A7A72;letter-spacing:0.5px;text-transform:uppercase;}
        .form-control{border:0.5px solid var(--border);border-radius:8px;font-size:14px;padding:10px 14px;}
        .form-control:focus{border-color:var(--rose);box-shadow:0 0 0 3px rgba(196,104,122,0.1);}
        .form-control.is-invalid{border-color:#dc3545;}
        .btn-auth{width:100%;padding:12px;background:var(--rose);color:white;border:none;border-radius:30px;font-size:14px;font-weight:500;cursor:pointer;margin-top:8px;}
        .btn-auth:hover{background:var(--rose-dark);}
        .auth-link{font-size:13px;color:#8A7A72;text-align:center;margin-top:20px;}
        .auth-link a{color:var(--rose-dark);text-decoration:none;font-weight:500;}
        .brand{font-family:var(--serif);font-size:26px;color:var(--rose-dark);text-align:center;margin-bottom:28px;}
        .brand span{color:var(--rose);}
        .nav-a{font-size:13px;color:#8A7A72;text-decoration:none;margin-left:16px;}
        .nav-a:hover{color:var(--rose-dark);}
    </style>
</head>
<body>
<div class="top-nav">
    <a href="/femfit/home" style="font-family:'Cormorant Garamond',serif;font-size:22px;color:#7A3040;text-decoration:none;">Fem<span style="color:#C4687A;">Fit</span></a>
    <div class="ms-auto">
        <a th:href="@{/home}" class="nav-a" th:text="#{nav.home}">Home</a>
        <a th:href="@{/schedule}" class="nav-a" th:text="#{nav.schedule}">Schedule</a>
        <a th:href="@{/plans}" class="nav-a" th:text="#{nav.membership}">Membership</a>
        <a th:href="@{/auth/login}" class="nav-a" style="color:#C4687A;font-weight:500;" th:text="#{nav.login}">Log In</a>
    </div>
</div>
<div class="auth-wrap">
    <div class="auth-card">
        <div class="brand">Fem<span>Fit</span></div>
        <div class="auth-title" th:text="#{auth.register.title}">Join FemFit</div>
        <div class="auth-sub">Create your account</div>
        <form th:action="@{/auth/register}" method="post" th:object="${registerDto}" novalidate>
            <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>
            <div class="row">
                <div class="col-6 mb-3">
                    <label class="form-label" th:text="#{auth.firstName}">First name</label>
                    <input type="text" th:field="*{firstName}"
                           th:class="${#fields.hasErrors('firstName')} ? 'form-control is-invalid' : 'form-control'"
                           placeholder="Anna" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                </div>
                <div class="col-6 mb-3">
                    <label class="form-label" th:text="#{auth.lastName}">Last name</label>
                    <input type="text" th:field="*{lastName}"
                           th:class="${#fields.hasErrors('lastName')} ? 'form-control is-invalid' : 'form-control'"
                           placeholder="Kim" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label" th:text="#{auth.email}">Email</label>
                <input type="email" th:field="*{email}"
                       th:class="${#fields.hasErrors('email')} ? 'form-control is-invalid' : 'form-control'"
                       placeholder="your@email.com" required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label" th:text="#{auth.phone}">Phone</label>
                <input type="tel" th:field="*{phone}" class="form-control" placeholder="+77001234567">
            </div>
            <div class="mb-3">
                <label class="form-label" th:text="#{auth.birthDate}">Date of birth</label>
                <input type="date" th:field="*{birthDate}" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label" th:text="#{auth.password}">Password</label>
                <input type="password" th:field="*{password}"
                       th:class="${#fields.hasErrors('password')} ? 'form-control is-invalid' : 'form-control'"
                       placeholder="Min 8 characters" required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>
            <button type="submit" class="btn-auth" th:text="#{auth.register.btn}">Create Account</button>
        </form>
        <div class="auth-link">
            <span th:text="#{auth.have.account}">Already have an account?</span>
            <a th:href="@{/auth/login}" th:text="#{nav.login}">Log In</a>
        </div>
    </div>
</div>
</body>
</html>
