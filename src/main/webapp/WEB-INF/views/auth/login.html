<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="#{auth.login.title} + ' — FemFit'">Log In — FemFit</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root { --rose:#C4687A; --rose-light:#F5E8EA; --rose-mid:#E8B4BC; --rose-dark:#7A3040; --rose-deep:#3D1520; --sand:#F7F3EE; --warm-white:#FDFAF7; --charcoal:#2C2420; --muted:#8A7A72; --border:#E8DDD8; --serif:'Cormorant Garamond',Georgia,serif; --sans:'DM Sans',sans-serif; }
    body { font-family:var(--sans); background:var(--warm-white); min-height:100vh; display:flex; flex-direction:column; }
    .top-nav { height:64px; border-bottom:1px solid var(--border); background:rgba(253,250,247,0.95); display:flex; align-items:center; padding:0 40px; gap:8px; }
    .logo { font-family:var(--serif); font-size:26px; font-weight:500; color:var(--rose-dark); text-decoration:none; margin-right:auto; }
    .logo span { color:var(--rose); }
    .nav-link { font-size:13px; color:var(--muted); padding:8px 16px; border-radius:30px; text-decoration:none; transition:all 0.2s; }
    .nav-link:hover { color:var(--charcoal); background:var(--sand); }
    .nav-cta { margin-left:8px; padding:9px 22px; background:var(--rose); color:white; border:none; border-radius:30px; font-size:13px; font-weight:500; cursor:pointer; font-family:var(--sans); text-decoration:none; display:inline-block; }
    .auth-wrap { flex:1; display:flex; align-items:center; justify-content:center; padding:40px 16px; }
    .auth-card { background:white; border:1px solid var(--border); border-radius:24px; padding:48px 40px; max-width:440px; width:100%; }
    .auth-title { font-family:var(--serif); font-size:32px; font-weight:400; color:var(--rose-deep); margin-bottom:8px; }
    .auth-sub { font-size:14px; color:var(--muted); margin-bottom:32px; }
    .form-label { font-size:12px; font-weight:500; color:var(--muted); letter-spacing:0.5px; text-transform:uppercase; display:block; margin-bottom:6px; }
    .form-control { width:100%; border:1px solid var(--border); border-radius:12px; font-size:14px; padding:12px 16px; font-family:var(--sans); background:white; color:var(--charcoal); outline:none; transition:border-color 0.2s; }
    .form-control:focus { border-color:var(--rose); box-shadow:0 0 0 3px rgba(196,104,122,0.1); }
    .mb { margin-bottom:20px; }
    .btn-auth { width:100%; padding:14px; background:var(--rose); color:white; border:none; border-radius:30px; font-size:14px; font-weight:500; cursor:pointer; font-family:var(--sans); transition:background 0.2s; margin-top:8px; }
    .btn-auth:hover { background:var(--rose-dark); }
    .alert { padding:12px 16px; border-radius:12px; font-size:13px; margin-bottom:20px; }
    .alert-error { background:#FEE2E2; color:#B91C1C; border:1px solid #FECACA; }
    .alert-success { background:#D1FAE5; color:#065F46; border:1px solid #A7F3D0; }
    .auth-link { font-size:13px; color:var(--muted); text-align:center; margin-top:24px; }
    .auth-link a { color:var(--rose-dark); text-decoration:none; font-weight:500; }
    footer { background:var(--rose-deep); color:rgba(255,255,255,0.7); text-align:center; padding:24px; font-size:13px; }
  </style>
</head>
<body>
<div class="top-nav">
  <a class="logo" th:href="@{/home}">Fem<span>Fit</span></a>
  <a class="nav-link" th:href="@{/home}" th:text="#{nav.home}">Home</a>
  <a class="nav-link" th:href="@{/schedule}" th:text="#{nav.schedule}">Schedule</a>
  <a class="nav-link" th:href="@{/plans}" th:text="#{nav.membership}">Membership</a>
  <a class="nav-cta" th:href="@{/auth/register}" th:text="#{nav.register}">Join Now</a>
</div>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-title" th:text="#{auth.login.title}">Welcome Back</div>
    <div class="auth-sub" th:text="#{auth.login.sub}">Sign in to your account</div>

    <div class="alert alert-error" th:if="${loginError}" th:text="#{auth.login.error}">
      Invalid email or password.
    </div>
    <div class="alert alert-success" th:if="${logoutMsg}" th:text="#{auth.logout.success}">
      You have been logged out.
    </div>
    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>

    <form th:action="@{/auth/login}" method="post">
      <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>
      <div class="mb">
        <label class="form-label" th:text="#{auth.email}">Email</label>
        <input type="email" name="username" class="form-control"
               placeholder="your@email.com" required autocomplete="email">
      </div>
      <div class="mb">
        <label class="form-label" th:text="#{auth.password}">Password</label>
        <input type="password" name="password" class="form-control"
               placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-auth" th:text="#{auth.login.btn}">Sign In</button>
    </form>
    <div class="auth-link">
      <span th:text="#{auth.no.account}">Don't have an account?</span>
      <a th:href="@{/auth/register}" th:text="#{nav.register}">Join Now</a>
    </div>
  </div>
</div>
<footer>
  <div style="font-family:'Cormorant Garamond',serif;font-size:20px;color:white;margin-bottom:4px;">FemFit</div>
  © 2026 FemFit. All rights reserved.
</footer>
</body>
</html>
