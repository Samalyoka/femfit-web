<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/layout :: head}">
  <title>My Orders — FemFit</title>
</head>
<body>
<nav th:replace="~{common/layout :: nav}"></nav>

<div class="page-wrap">

  <div class="profile-hero">
    <a th:href="@{/client/profile}" class="back-link">← <span th:text="#{nav.profile}">My Profile</span></a>
    <p class="section-eyebrow" th:text="#{client.account}">My Account</p>
    <h1 class="section-title" th:text="#{client.orders}">My Orders</h1>
  </div>

  <!-- Flash messages -->
  <div th:if="${successMsg}" class="alert alert-success" th:text="#{${successMsg}}"></div>
  <div th:if="${success}" class="alert alert-success" th:text="#{${success}}"></div>
  <div th:if="${error}" class="alert alert-error" th:text="#{${error}}"></div>

  <div class="profile-section-card">

    <!-- Empty state -->
    <div th:if="${#lists.isEmpty(orders)}" class="profile-empty">
      <p th:text="#{client.orders.empty}">You have no orders yet.</p>
      <a th:href="@{/client/cycles}" class="btn-primary"
         style="margin-top: 16px; display: inline-block;"
         th:text="#{nav.cycles}">Browse Programmes</a>
    </div>

    <!-- Orders list -->
    <div th:each="order : ${orders}" class="order-row">

      <!-- Order info -->
      <div class="order-info">
        <div class="order-title" th:text="${order.getLocalizedCycleTitle(#locale.language)}">Programme</div>
        <div class="order-meta">
          <span class="order-date"
                th:text="${@dateFormatter.format(order.createdAt)}">Date</span>
          <span th:class="'order-status status-' + ${order.status.toLowerCase()}"
                th:text="${order.status}">Status</span>
        </div>
        <div class="order-price"
             th:text="${#numbers.formatDecimal(order.paidAmount, 0, 'COMMA', 0, 'POINT')} + ' ₸'">Price</div>
        <div class="order-date" style="margin-top: 4px;"
             th:if="${order.trainerName != null}"
             th:text="#{client.orders.trainer} + ' ' + ${order.trainerName}">Trainer</div>
      </div>

      <!-- Action buttons — все одинакового размера -->
      <div style="display: flex; flex-direction: column; gap: 10px; align-items: flex-end; min-width: 170px;">

        <!-- ACTIVE / PENDING -->
        <th:block th:if="${order.status == 'ACTIVE' or order.status == 'PENDING'}">
          <a th:href="@{/client/assignment/{id}(id=${order.id})}"
             class="btn-outline"
             style="white-space: nowrap; width: 170px; text-align: center;"
             th:text="#{client.orders.view.assignment}">View Assignment</a>
        </th:block>

        <!-- COMPLETED -->
        <th:block th:if="${order.status == 'COMPLETED'}">
          <a th:href="@{/client/assignment/{id}(id=${order.id})}"
             class="btn-outline"
             style="white-space: nowrap; width: 170px; text-align: center;"
             th:text="#{client.orders.view.assignment}">View Assignment</a>

          <th:block th:if="${reviewedOrderIds != null and reviewedOrderIds.contains(order.id)}">
            <span class="review-submitted-badge" th:text="#{review.already.submitted}">✓ Review submitted</span>
          </th:block>

          <th:block th:unless="${reviewedOrderIds != null and reviewedOrderIds.contains(order.id)}">
            <a th:href="@{/client/review/{id}(id=${order.id})}"
               class="btn-outline"
               style="white-space: nowrap; width: 170px; text-align: center; border-color: var(--rose); color: var(--rose);"
               th:text="#{review.leave}">Leave a Review</a>
          </th:block>
        </th:block>

        <!-- CANCELLED -->
        <th:block th:if="${order.status == 'CANCELLED'}">
          <span class="review-submitted-badge" th:text="#{client.orders.cancelled}">Cancelled</span>
        </th:block>

      </div>
    </div>

  </div>

  <!-- Pagination -->
  <div th:if="${totalPages > 1}" class="pagination">
    <a class="pagination__btn"
       th:if="${currentPage > 1}"
       th:href="@{/client/orders(page=${currentPage - 1})}"
       th:text="#{pagination.prev}">← Prev</a>
    <span th:unless="${currentPage > 1}"
          class="pagination__btn" style="opacity:0.3; cursor:default;"
          th:text="#{pagination.prev}">← Prev</span>

    <span class="pagination__info"
          th:text="#{pagination.page(${currentPage}, ${totalPages})}">
    Page 1 of 2
  </span>

    <a class="pagination__btn"
       th:if="${currentPage < totalPages}"
       th:href="@{/client/orders(page=${currentPage + 1})}"
       th:text="#{pagination.next}">Next →</a>
    <span th:unless="${currentPage < totalPages}"
          class="pagination__btn" style="opacity:0.3; cursor:default;"
          th:text="#{pagination.next}">Next →</span>
  </div>

  <!-- Browse more -->
  <div style="margin-top: 24px; text-align: center;">
    <a th:href="@{/client/cycles}" class="btn-outline"
       th:text="#{client.orders.browse.more}">Browse More Programmes</a>
  </div>

</div>

<footer th:replace="~{common/layout :: footer}"></footer>
</body>
</html>
