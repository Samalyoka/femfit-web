<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="#{profile.title} + ' — FemFit'">Profile — FemFit</title>
  <link rel="stylesheet" th:href="@{/static/css/main.css}">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

<nav th:replace="~{common/layout :: nav}"></nav>

<div class="page-wrap">

  <div class="profile-hero">
    <p class="section-eyebrow" th:text="#{nav.profile}">My Profile</p>
    <h1 class="section-title" th:text="#{profile.title}">My Profile</h1>
  </div>

  <div class="profile-grid">

    <!-- Left: member card -->
    <aside class="profile-card">
      <div class="profile-avatar-wrap">
        <div class="profile-avatar"
             th:style="${member.avatarUrl != null} ? 'background-image:url(' + ${member.avatarUrl} + ');background-size:cover;background-position:center;color:transparent;' : ''">
          <img th:if="${member.avatarUrl != null}" th:src="${member.avatarUrl}"
               class="profile-avatar__img" th:alt="${member.initials}" aria-hidden="true"/>
          <span th:if="${member.avatarUrl == null}" th:text="${member.initials}">AK</span>
        </div>
        <label class="profile-avatar-edit" title="Upload photo">
          <input type="file" name="avatarFile" accept="image/jpeg,image/png,image/webp"
                 class="profile-avatar-input" id="avatarInput"/>
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M12 20H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1l2-3h8l2 3h1a2 2 0 0 1 2 2v3"
                  stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <circle cx="12" cy="13" r="3" stroke="currentColor" stroke-width="1.6"/>
            <path d="M18 14v6M15 17h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </label>
      </div>
      <form id="avatarForm" th:action="@{/client/profile/avatar}" method="post"
            enctype="multipart/form-data" style="display:none;">
        <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>
        <input type="file" name="avatarFile" id="avatarInputHidden" accept="image/jpeg,image/png,image/webp"/>
      </form>
      <script>
        document.getElementById('avatarInput').addEventListener('change', function() {
          if (this.files.length) {
            var hidden = document.getElementById('avatarInputHidden');
            var dt = new DataTransfer();
            dt.items.add(this.files[0]);
            hidden.files = dt.files;
            document.getElementById('avatarForm').submit();
          }
        });
      </script>
      <div class="profile-name" th:text="${member.fullName}"></div>
      <div class="profile-badge" th:text="#{profile.badge}">Premium member</div>
      <div class="profile-divider"></div>
      <div class="profile-meta">
        <div class="profile-meta-row">
          <span th:text="#{profile.member.since}">Member since</span>
          <span th:text="${@dateFormatter.formatMonthYear(member.registrationDate)}"></span>
        </div>
        <div class="profile-meta-row">
          <span th:text="#{auth.email}">Email</span>
          <span th:text="${member.email}"></span>
        </div>
      </div>
    </aside>

    <!-- Right: main content -->
    <div class="profile-main">

      <!-- Flash messages -->
      <div th:if="${error}" class="alert alert-error" th:text="#{${error}}"></div>
      <div th:if="${success}" class="alert alert-success" th:text="#{${success}}"></div>

      <!-- Edit Profile + Change Password (collapsible) -->
      <details class="profile-section-card profile-edit-details">
        <summary class="profile-edit-summary">
          <span class="profile-section-title" th:text="#{profile.edit.title}">Edit Profile</span>
          <span class="profile-edit-hint" th:text="#{profile.edit.hint}">(click to edit)</span>
        </summary>

        <div class="profile-edit-body">

          <!-- Edit profile form -->
          <form th:action="@{/client/profile/edit}" method="post" th:object="${updateProfileDto}">
            <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>

            <div class="row-2 mb">
              <div>
                <label class="form-label" th:text="#{auth.firstName}">First name</label>
                <input type="text" th:field="*{firstName}"
                       th:class="${#fields.hasErrors('firstName')} ? 'form-control is-invalid' : 'form-control'"
                       pattern="[\p{L} '\-]+" required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
              </div>
              <div>
                <label class="form-label" th:text="#{auth.lastName}">Last name</label>
                <input type="text" th:field="*{lastName}"
                       th:class="${#fields.hasErrors('lastName')} ? 'form-control is-invalid' : 'form-control'"
                       pattern="[\p{L} '\-]+" required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
              </div>
            </div>

            <div class="row-2 mb">
              <div>
                <label class="form-label" th:text="#{auth.phone}">Phone</label>
                <input type="tel" th:field="*{phone}"
                       th:class="${#fields.hasErrors('phone')} ? 'form-control is-invalid' : 'form-control'"
                       placeholder="87001234567">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
              </div>
              <div>
                <label class="form-label" th:text="#{auth.birthDate}">Date of birth</label>
                <input type="date" th:field="*{birthDate}"
                       th:class="${#fields.hasErrors('birthDate')} ? 'form-control is-invalid' : 'form-control'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}"></div>
              </div>
            </div>

            <button type="submit" class="btn btn--primary" th:text="#{profile.edit.submit}">Save Changes</button>
          </form>

          <!-- Divider between forms -->
          <div class="profile-divider" style="margin: 32px 0;"></div>

          <!-- Change password form (inside same collapsible) -->
          <h3 class="profile-section-title" style="font-size: 18px; margin-bottom: 20px;"
              th:text="#{profile.change.password}">Change Password</h3>

          <form th:action="@{/client/profile/password}" method="post" th:object="${changePasswordDto}">
            <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>

            <div class="mb">
              <label class="form-label" th:text="#{profile.password.current}">Current password</label>
              <input type="password" th:field="*{currentPassword}" class="form-control"
                     autocomplete="current-password" required>
            </div>

            <div class="row-2 mb">
              <div>
                <label class="form-label" th:text="#{profile.password.new}">New password</label>
                <input type="password" th:field="*{newPassword}" class="form-control"
                       autocomplete="new-password" required minlength="8">
              </div>
              <div>
                <label class="form-label" th:text="#{profile.password.confirm}">Confirm new password</label>
                <input type="password" th:field="*{confirmPassword}" class="form-control"
                       autocomplete="new-password" required minlength="8">
              </div>
            </div>

            <button type="submit" class="btn btn--primary" th:text="#{profile.password.submit}">Update Password</button>
          </form>

        </div>
      </details>

      <!-- Stats -->
      <div class="profile-stats">
        <div class="stat-card">
          <div class="stat-num" th:text="${visitCount}">0</div>
          <div class="stat-label" th:text="#{profile.stats.visits}">Visits this month</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" th:text="${#lists.size(bookings)}">0</div>
          <div class="stat-label" th:text="#{profile.stats.bookings}">Upcoming bookings</div>
        </div>
        <a class="stat-card" th:href="@{/client/orders}" style="text-decoration:none;">
          <div class="stat-num" th:text="${#lists.size(orders)}">0</div>
          <div class="stat-label" th:text="#{client.orders}">Orders</div>
        </a>
        <a class="stat-card" th:href="@{/client/cycles}" style="text-decoration:none;">
          <div class="stat-num">→</div>
          <div class="stat-label" th:text="#{nav.cycles}">Programs</div>
        </a>
        <a class="stat-card" th:href="@{/client/archive}" style="text-decoration:none;">
          <div class="stat-num">→</div>
          <div class="stat-label" th:text="#{client.archive}">My Archive</div>
        </a>
      </div>

      <!-- Upcoming bookings -->
      <div class="profile-section-card">
        <h2 class="profile-section-title" th:text="#{profile.upcoming}">Upcoming bookings</h2>

        <div th:if="${#lists.isEmpty(bookings)}" class="profile-empty">
          <span th:text="#{profile.no.bookings}">No upcoming bookings</span>
        </div>

        <div th:each="b : ${bookings}" class="booking-row">
          <div class="booking-info">
            <div class="booking-name" th:text="${b.className}"></div>
            <div class="booking-time"
                 th:text="${@dateFormatter.formatSchedule(b.scheduledAt)}"></div>
          </div>
          <form th:action="@{/client/booking/cancel/{id}(id=${b.id})}" method="post">
            <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>
            <button type="submit" class="btn-cancel"
                    th:text="#{profile.cancel.booking}">Cancel</button>
          </form>
        </div>
      </div>

      <!-- Active training plans (assignments) -->
      <div class="profile-section-card" th:if="${not #lists.isEmpty(orders)}">
        <h2 class="profile-section-title" th:text="#{profile.my.plans}">My Training Plans</h2>

        <div th:each="o : ${orders}" class="booking-row">
          <div class="booking-info">
            <div class="booking-name" th:text="${o.getLocalizedCycleTitle(#locale.language)}"></div>
            <div class="booking-time">
              <span th:class="'order-status status-' + ${o.status.toLowerCase()}"
                    th:text="${o.status == 'ACTIVE'} ? #{order.status.active} : (${o.status == 'COMPLETED'} ? #{order.status.completed} : (${o.status == 'CANCELLED'} ? #{order.status.cancelled} : #{order.status.pending}))"></span>
              <span th:if="${o.trainerName != null}"
                    style="margin-left: 8px;"
                    th:text="'· ' + ${o.trainerName}"></span>
            </div>
          </div>
          <a th:href="@{/client/assignment/{id}(id=${o.id})}"
             class="btn-cancel"
             th:text="#{profile.view.plan}">View Plan</a>
        </div>
      </div>

    </div>
  </div>
</div>

<footer th:replace="~{common/layout :: footer}"></footer>
</body>
</html>
