<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="#{profile.title} + ' — FemFit'">Profile — FemFit</title>
  <link rel="stylesheet" th:href="@{/static/css/main.css}">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

<nav th:replace="~{common/layout :: nav}"></nav>

<div class="page-wrap">

  <div class="profile-hero">
    <p class="section-eyebrow" th:text="#{nav.profile}">My Profile</p>
    <h1 class="section-title" th:text="#{profile.title}">My Profile</h1>
  </div>

  <div class="profile-grid">

    <!-- Left: member card -->
    <aside class="profile-card">
      <div class="profile-avatar" th:text="${member.initials}"></div>
      <div class="profile-name" th:text="${member.fullName}"></div>
      <div class="profile-badge" th:text="#{profile.badge}">Premium member</div>
      <div class="profile-divider"></div>
      <div class="profile-meta">
        <div class="profile-meta-row">
          <span th:text="#{profile.member.since}">Member since</span>
          <span th:text="${#temporals.format(member.registrationDate,'MMM yyyy')}"></span>
        </div>
        <div class="profile-meta-row">
          <span>Email</span>
          <span th:text="${member.email}"></span>
        </div>
      </div>
    </aside>

    <!-- Right: stats + bookings -->
    <div class="profile-main">

      <div th:if="${error}" class="alert alert-error" th:text="#{${error}}"></div>
      <div th:if="${success}" class="alert alert-success" th:text="#{${success}}"></div>

      <!-- Stats -->
      <div class="profile-stats">
        <div class="stat-card">
          <div class="stat-num" th:text="${visitCount}">0</div>
          <div class="stat-label" th:text="#{profile.stats.visits}">Visits this month</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" th:text="${#lists.size(bookings)}">0</div>
          <div class="stat-label" th:text="#{profile.stats.bookings}">Upcoming bookings</div>
        </div>
        <a class="stat-card" th:href="@{/client/orders}" style="text-decoration:none;">
          <div class="stat-num" th:text="${#lists.size(orders)}">0</div>
          <div class="stat-label" th:text="#{client.orders}">Orders</div>
        </a>
        <a class="stat-card" th:href="@{/client/cycles}" style="text-decoration:none;">
          <div class="stat-num">→</div>
          <div class="stat-label" th:text="#{nav.cycles}">Programs</div>
        </a>
      </div>

      <!-- Bookings -->
      <div class="profile-section-card">
        <h2 class="profile-section-title" th:text="#{profile.upcoming}">Upcoming bookings</h2>

        <div th:if="${#lists.isEmpty(bookings)}" class="profile-empty">
          <span th:text="#{profile.no.bookings}">No upcoming bookings</span>
        </div>

        <div th:each="b : ${bookings}" class="booking-row">
          <div class="booking-info">
            <div class="booking-name" th:text="${b.className}"></div>
            <div class="booking-time"
                 th:text="${#temporals.format(b.scheduledAt,'EEE, d MMM · HH:mm')}"></div>
          </div>
          <form th:action="@{/client/booking/cancel/{id}(id=${b.id})}" method="post">
            <button type="submit" class="btn-cancel"
                    th:text="#{profile.cancel.booking}">Cancel</button>
          </form>
        </div>
      </div>
      <!-- === Add as a new section card, e.g. after the bookings profile-section-card === -->

      <!-- Change password -->
      <div class="profile-section-card">
        <h2 class="profile-section-title" th:text="#{profile.change.password}">Change Password</h2>

        <form th:action="@{/client/profile/password}" method="post" th:object="${changePasswordDto}">
          <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>

          <div class="mb">
            <label class="form-label" th:text="#{profile.password.current}">Current password</label>
            <input type="password" th:field="*{currentPassword}" class="form-control"
                   autocomplete="current-password" required>
          </div>

          <div class="row-2 mb">
            <div>
              <label class="form-label" th:text="#{profile.password.new}">New password</label>
              <input type="password" th:field="*{newPassword}" class="form-control"
                     autocomplete="new-password" required minlength="8">
            </div>
            <div>
              <label class="form-label" th:text="#{profile.password.confirm}">Confirm new password</label>
              <input type="password" th:field="*{confirmPassword}" class="form-control"
                     autocomplete="new-password" required minlength="8">
            </div>
          </div>

          <button type="submit" class="btn btn--primary" th:text="#{profile.password.submit}">Update Password</button>
        </form>
      </div>

    </div>
  </div>
</div>

<footer th:replace="~{common/layout :: footer}"></footer>
</body>
</html>
