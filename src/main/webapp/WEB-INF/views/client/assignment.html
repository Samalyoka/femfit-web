<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment — FemFit</title>
  <link rel="stylesheet" th:href="@{/static/css/main.css}">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
<nav th:replace="~{common/layout :: nav}"></nav>

<div class="page-wrap">
  <div class="profile-hero">
    <p class="section-eyebrow">My Training</p>
    <h1 class="section-title" th:text="${order?.cycleTitle} ?: 'Assignment'"></h1>
  </div>

  <div th:if="${assignment != null}">
    <div class="profile-grid">
      <div class="profile-card">
        <div class="profile-section-title" style="text-align:left;">Order Info</div>
        <div class="profile-meta">
          <div class="profile-meta-row">
            <span>Program</span>
            <span th:text="${order.cycleTitle}"></span>
          </div>
          <div class="profile-meta-row">
            <span>Status</span>
            <span th:text="${order.status}"></span>
          </div>
          <div class="profile-meta-row">
            <span>Trainer</span>
            <span th:text="${order.trainerName} ?: 'Not assigned'"></span>
          </div>
          <div class="profile-meta-row">
            <span>Ordered</span>
            <span th:text="${#temporals.format(order.createdAt,'dd MMM yyyy')}"></span>
          </div>
        </div>
      </div>

      <div class="profile-main">
        <div class="profile-section-card">
          <h2 class="profile-section-title">Exercises</h2>
          <p class="assignment-text" th:text="${assignment.exercises} ?: 'Not specified'"></p>
        </div>
        <div class="profile-section-card">
          <h2 class="profile-section-title">Required Equipment</h2>
          <p class="assignment-text" th:text="${assignment.equipment} ?: 'Not specified'"></p>
        </div>
        <div class="profile-section-card">
          <h2 class="profile-section-title">Nutrition Plan</h2>
          <p class="assignment-text" th:text="${assignment.nutritionPlan} ?: 'Not specified'"></p>
        </div>

        <div th:if="${assignment.status != 'REVISION_REQUESTED'}">
          <form th:action="@{/client/assignment/revision/{id}(id=${assignment.id})}" method="post">
            <button type="submit" class="btn-outline">Request Revision</button>
          </form>
        </div>
        <div th:if="${assignment.status == 'REVISION_REQUESTED'}">
          <span class="cycle-badge">Revision requested</span>
        </div>
      </div>
    </div>
  </div>

  <div th:unless="${assignment != null}" class="profile-section-card">
    <div class="profile-empty">
      No assignment yet. Your trainer will create one soon.
    </div>
  </div>

  <div style="margin-top:24px;">
    <a th:href="@{/client/orders}" class="btn-outline">← Back to Orders</a>
  </div>
</div>

<footer th:replace="~{common/layout :: footer}"></footer>
</body>
</html>
