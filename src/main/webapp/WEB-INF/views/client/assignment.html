<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <title th:text="#{client.assignments} + ' — FemFit'">Assignment — FemFit</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --rose: #C4687A; --rose-light: #F5E8EA; --rose-mid: #E8B4BC;
      --rose-dark: #7A3040; --muted: #8A7A72; --border: #E8DDD8;
      --serif: 'Cormorant Garamond', Georgia, serif;
    }
    body { font-family: 'DM Sans', sans-serif; background: #FDFAF7; color: #2C2420; }
    .section-card {
      background: white; border: 0.5px solid var(--border);
      border-radius: 16px; padding: 28px; margin-bottom: 16px;
    }
    .section-label {
      font-size: 11px; font-weight: 500; letter-spacing: 2px;
      text-transform: uppercase; color: var(--rose);
      margin-bottom: 12px;
    }
    .section-content {
      font-size: 14px; color: #2C2420; line-height: 1.8;
      white-space: pre-line;
    }
    .status-badge {
      font-size: 12px; padding: 4px 14px; border-radius: 12px;
      font-weight: 500; display: inline-block;
    }
    .status-ACTIVE { background: #E8F5EE; color: #2E7D52; }
    .status-COMPLETED { background: #F1EFE8; color: var(--muted); }
    .status-REVISION_REQUESTED { background: #FFF3E0; color: #E65100; }
    .empty-state {
      text-align: center; padding: 60px 20px;
      color: var(--muted); font-size: 14px;
    }
    .empty-icon { font-size: 40px; margin-bottom: 16px; opacity: 0.4; }
  </style>
</head>
<body>
<nav th:replace="~{common/layout :: nav}"></nav>

<div class="container py-5" style="max-width: 760px;">
  <a th:href="@{/client/profile}" style="font-size:13px;color:var(--muted);text-decoration:none;">← Back to profile</a>

  <!-- Order info -->
  <div th:if="${order}" style="margin: 20px 0 32px;">
    <p style="font-size:11px;letter-spacing:3px;color:var(--rose);text-transform:uppercase;margin-bottom:8px;" th:text="#{client.assignments}">Assignment</p>
    <h1 style="font-family:var(--serif);font-size:34px;font-weight:400;color:#3D1520;margin-bottom:6px;" th:text="${order.cycleTitle}">Training Cycle</h1>
    <div class="d-flex align-items-center gap-3">
      <span th:class="'status-badge status-' + ${order.status}" th:text="${order.status}">ACTIVE</span>
      <span style="font-size:13px;color:var(--muted);" th:if="${order.trainerName}" th:text="'Trainer: ' + ${order.trainerName}">Trainer: Elena M.</span>
    </div>
  </div>

  <!-- Assignment content -->
  <div th:if="${assignment}">

    <div class="section-card">
      <div class="section-label" th:text="#{client.assignment.exercises}">Exercises</div>
      <div class="section-content" th:text="${assignment.exercises} ?: 'No exercises assigned yet.'">—</div>
    </div>

    <div class="section-card">
      <div class="section-label" th:text="#{client.assignment.equipment}">Required equipment</div>
      <div class="section-content" th:text="${assignment.equipment} ?: 'No equipment specified.'">—</div>
    </div>

    <div class="section-card">
      <div class="section-label" th:text="#{client.assignment.nutrition}">Nutrition plan</div>
      <div class="section-content" th:text="${assignment.nutritionPlan} ?: 'No nutrition plan yet.'">—</div>
    </div>

    <div class="section-card" th:if="${assignment.scheduleInfo}">
      <div class="section-label">Training schedule</div>
      <div class="section-content" th:text="${assignment.scheduleInfo}">—</div>
    </div>

    <!-- Updated date -->
    <div style="font-size:12px;color:var(--muted);margin-top:8px;" th:if="${assignment.updatedAt}">
      Last updated: <span th:text="${#temporals.format(assignment.updatedAt,'d MMM yyyy, HH:mm')}">1 Jun 2026</span>
    </div>

    <!-- Request revision -->
    <div class="mt-4" th:if="${assignment.status == 'ACTIVE'}">
      <form th:action="@{/client/assignment/revision/{id}(id=${assignment.id})}" method="post">
        <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>
        <button type="submit" class="btn btn-outline-secondary" style="border-radius:30px;font-size:13px;" th:text="#{client.request.revision}">Request revision</button>
      </form>
    </div>

  </div>

  <!-- No assignment yet -->
  <div th:unless="${assignment}" class="section-card">
    <div class="empty-state">
      <div class="empty-icon">📋</div>
      <div style="font-family:var(--serif);font-size:20px;color:#3D1520;margin-bottom:8px;">No assignment yet</div>
      <div>Your trainer will create a personalized training plan for you soon.</div>
    </div>
  </div>

</div>

<footer th:replace="~{common/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
