<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<head th:replace="~{common/layout :: head}">
  <title>Training Programs — FemFit</title>
</head>
<body>
<nav th:replace="~{common/layout :: nav}"></nav>

<div class="page-wrap">
  <div class="profile-hero">
    <a th:href="@{/client/profile}" class="back-link">← <span th:text="#{nav.profile}">My Profile</span></a>
    <p class="section-eyebrow" th:text="#{cycles.eyebrow}">Training Programs</p>
    <h1 class="section-title" th:text="#{cycles.title}">Choose your program</h1>
  </div>

  <div class="cycles-grid">
    <div th:each="cycle : ${cycles}" class="cycle-card">
      <div class="cycle-photo" th:if="${cycle.photoUrl}">
        <img th:src="@{${cycle.photoUrl}}" th:alt="${cycle.getLocalizedTitle(#locale.language)}">
      </div>
      <div class="cycle-header">
        <h2 class="cycle-title" th:text="${cycle.getLocalizedTitle(#locale.language)}"></h2>
        <div class="cycle-duration">
          <span th:text="${cycle.durationWeeks}"></span>
          <span th:text="#{cycles.weeks}"> weeks</span>
        </div>
      </div>
      <p class="cycle-desc" th:text="${cycle.getLocalizedDescription(#locale.language)}"></p>
      <div class="cycle-footer">
        <div class="cycle-price"
             th:text="${#numbers.formatDecimal(cycle.price, 0, 'COMMA', 0, 'POINT')} + ' ₸'"></div>

        <!-- Purchased — show badge + renew button -->
        <div th:if="${purchasedCycleIds.contains(cycle.id)}"
             style="display: flex; flex-direction: column; align-items: flex-end; gap: 8px;">
          <span class="cycle-badge" th:text="#{cycles.purchased}">Purchased</span>
          <a class="btn btn--outline"
             style="font-size: 13px; padding: 6px 16px;"
             th:href="@{/client/cycles/{id}/choose-trainer(id=${cycle.id})}"
             th:text="#{cycles.renew}">Renew / Buy again</a>
        </div>

        <!-- Not purchased -->
        <div th:unless="${purchasedCycleIds.contains(cycle.id)}">
          <a class="btn btn--primary"
             th:href="@{/client/cycles/{id}/choose-trainer(id=${cycle.id})}"
             th:text="#{cycles.buy.now}">Buy Now</a>
        </div>
      </div>

    </div>
  </div>

  <!-- Pagination -->
  <div th:if="${totalPages > 1}" class="pagination">
    <a class="pagination__btn"
       th:if="${currentPage > 1}"
       th:href="@{/client/cycles(page=${currentPage - 1})}"
       th:text="#{pagination.prev}">Previous</a>

    <span class="pagination__info">
      <th:block th:text="${currentPage}">1</th:block>
      /
      <th:block th:text="${totalPages}">1</th:block>
    </span>

    <a class="pagination__btn"
       th:if="${currentPage < totalPages}"
       th:href="@{/client/cycles(page=${currentPage + 1})}"
       th:text="#{pagination.next}">Next</a>
  </div>
</div>

<footer th:replace="~{common/layout :: footer}"></footer>
</body>
</html>
