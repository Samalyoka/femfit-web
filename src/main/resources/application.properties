# ══════════════════════════════════════
#  FemFit — Application Configuration
# ══════════════════════════════════════

# Database
db.url=jdbc:postgresql://localhost:5432/femfit
db.username=postgres
db.password=postgres
db.driver=org.postgresql.Driver

# Connection Pool
db.pool.size=10
db.pool.timeout=30000

# Application
app.name=FemFit
app.version=1.0.0
app.encoding=UTF-8

# i18n
app.default.locale=en

# Pagination
app.page.size=10

# Logging
logging.level=INFO