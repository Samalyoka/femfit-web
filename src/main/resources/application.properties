# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550
#  FemFit \u2014 Application Configuration
# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550

# Database
db.url=jdbc:postgresql://localhost:5432/femfit
db.username=postgres
db.password=postgres
db.driver=org.postgresql.Driver

# Connection Pool
db.pool.size=10
db.pool.timeout=30000

# Application
app.name=FemFit
app.version=1.0.0
app.encoding=UTF-8

# i18n
app.default.locale=en

# Pagination
app.page.size=10

# Logging
logging.level=INFO
# Email reminders (optional \u2014 disabled by default).
# Set mail.enabled=true and fill in SMTP credentials to activate.
# When disabled, EmailService logs what it would have sent instead.
mail.enabled=false
mail.smtp.host=smtp.gmail.com
mail.smtp.port=587
mail.smtp.username=
mail.smtp.password=
mail.from.address=noreply@femfit.kz
mail.from.name=FemFit
# Hours before class to send reminder
mail.reminder.hours.before=24

# Avatar upload \u2014 absolute path to deployed webapp root
# Set this to your Tomcat webapps/femfit directory
# Example: /Users/baitu/apache-tomcat-10.1.54/webapps/femfit
app.upload.base-path=/Users/baitu/apache-tomcat-10.1.54/webapps/femfit


