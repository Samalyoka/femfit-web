about.schedule.features.title=What makes your schedule work
about.schedule.f1.title=Fits your lifestyle
about.schedule.f1.desc=Your trainer designs the schedule around your work hours, family commitments and personal preferences.
about.schedule.f2.title=Progressive intensity
about.schedule.f2.desc=Each week builds on the last \u2014 with planned deload weeks to prevent overtraining and keep you progressing safely.
about.schedule.f3.title=Balanced recovery
about.schedule.f3.desc=Strategic rest days and active recovery sessions are built in \u2014 so you train hard without burning out.
about.schedule.f4.title=Flexible adjustments
about.schedule.f4.desc=Life happens. Request a schedule revision anytime and your trainer will update the plan to keep you on track.
about.schedule.cta.title=Get your personalised schedule
about.schedule.cta.sub=Join a programme today and receive a training schedule built around your life.

about.trainers.eyebrow=Our team
about.trainers.gallery.title=Meet our trainers
about.trainers.title=Personal trainers
about.trainers.sub=Every FemFit member is paired with a certified personal trainer who designs a programme around your unique goals, body, and lifestyle. No generic plans \u2014 just expert guidance built for you.
about.trainers.how.title=What your trainer does for you
about.trainers.step1.title=Gets to know you
about.trainers.step1.desc=Your trainer begins with a full assessment of your current fitness level, health history, goals and schedule \u2014 so every recommendation is relevant to you specifically.
about.trainers.step2.title=Builds your personal programme
about.trainers.step2.desc=Based on your assessment, your trainer creates a complete training plan \u2014 covering workouts, nutrition, equipment and weekly schedule \u2014 tailored to your body and your life.
about.trainers.step3.title=Tracks your progress
about.trainers.step3.desc=Your trainer monitors your results and adjusts the programme as you improve \u2014 keeping you challenged, safe and moving consistently forward.
about.trainers.step4.title=Supports you along the way
about.trainers.step4.desc=If something isn't working, request a revision. Your trainer will update your plan \u2014 whether that's a different exercise, a new nutrition approach, or an adjusted schedule.
about.trainers.features.title=What makes a FemFit trainer different
about.trainers.f1.title=Women-only specialists
about.trainers.f1.desc=All our trainers are experienced in women's physiology, hormonal considerations and strength training for every stage of life.
about.trainers.f2.title=Fully certified
about.trainers.f2.desc=Every trainer holds recognised fitness certifications and undergoes ongoing professional development.
about.trainers.f3.title=Results-focused
about.trainers.f3.desc=Your trainer is invested in your progress \u2014 measuring outcomes, celebrating milestones and keeping you accountable.
about.trainers.f4.title=Flexible and adaptable
about.trainers.f4.desc=Your trainer adapts your plan if your schedule shifts, your goals evolve, or you simply need something different.
about.trainers.cta.title=Meet your trainer today
about.trainers.cta.sub=Choose a training programme and select the trainer you'd like to work with. Your personal plan will be ready from day one.

about.community.eyebrow=Our community
about.community.title=Women's community
about.community.sub=FemFit is more than a gym \u2014 it's a space built entirely for women. A place where you feel safe, supported and surrounded by people who celebrate your progress.
about.community.space.title=A space designed for you
about.community.f1.title=Women only
about.community.f1.desc=Every class, every studio, every session \u2014 exclusively for women. No judgement, no distractions, just you and a community that gets it.
about.community.f2.title=Inclusive and welcoming
about.community.f2.desc=Whether you're a complete beginner or an experienced athlete, FemFit welcomes you exactly as you are.
about.community.f3.title=Celebrate every win
about.community.f3.desc=Your first workout, your first completed programme \u2014 every achievement matters here. We celebrate progress, not perfection.
about.community.f4.title=Focused on wellbeing
about.community.f4.desc=We believe fitness is about feeling strong and energised \u2014 not punishing your body. Your wellbeing comes first, always.
about.community.why.title=Why community matters
about.community.why1.title=More likely to stay consistent
about.community.why1.desc=People who exercise in a supportive social environment are three times more likely to maintain their fitness habits long-term.
about.community.why2.title=Better mental health outcomes
about.community.why2.desc=Exercising in a positive, non-judgemental space significantly improves mood, reduces anxiety and builds self-confidence.
about.community.why3.title=A network that lasts
about.community.why3.desc=The connections you make at FemFit often extend beyond fitness. Many members find friendships and a genuine sense of belonging.
about.community.cta.title=Join the FemFit community
about.community.cta.sub=Become part of a community of women who support each other, celebrate each other, and grow together.

