# About exercises page
about.exercises.eyebrow=Your programme
about.exercises.title=Personalised workout routines
about.exercises.sub=Every member receives a tailored exercise plan designed by a certified personal trainer \u2014 built around your goals, fitness level and available time.
about.exercises.how.title=How it works
about.exercises.step1.title=Choose your programme
about.exercises.step1.desc=Browse our training cycles and select the one that matches your goals \u2014 strength, cardio, flexibility or full body.
about.exercises.step2.title=Get matched with a trainer
about.exercises.step2.desc=Choose your personal trainer or let us assign the best match for your goals and schedule.
about.exercises.step3.title=Receive your plan
about.exercises.step3.desc=Your trainer creates a personalised exercise plan \u2014 with sets, reps, rest periods and progression milestones \u2014 visible in your profile.
about.exercises.step4.title=Request changes anytime
about.exercises.step4.desc=If an exercise doesn\u2019t suit you, request a revision. Your trainer will adjust the plan to keep you progressing comfortably.
about.exercises.includes.title=What your workout plan includes
about.exercises.f1.title=Strength training
about.exercises.f1.desc=Progressive overload programmes to build lean muscle and increase overall strength.
about.exercises.f2.title=Structured scheduling
about.exercises.f2.desc=Clear weekly structure with workout days, rest days and active recovery sessions.
about.exercises.f3.title=Progressive milestones
about.exercises.f3.desc=Your plan evolves as you improve \u2014 with tracked milestones and gradual intensity increases.
about.exercises.f4.title=Trainer support
about.exercises.f4.desc=Your trainer reviews your progress and adjusts the programme whenever you need it.
about.exercises.cta.title=Ready to start your journey?
about.exercises.cta.sub=Choose a training programme and get your personalised workout plan from a certified trainer.
about.exercises.cta.btn=Browse programmes

# About nutrition page
about.nutrition.eyebrow=Fuel your goals
about.nutrition.title=Personalised nutrition plan
about.nutrition.sub=Good training starts in the kitchen. Your trainer designs a nutrition plan to complement your workouts \u2014 helping you recover faster, feel energised and reach your goals sooner.
about.nutrition.includes.title=What your nutrition plan includes
about.nutrition.f1.title=Meal recommendations
about.nutrition.f1.desc=Practical meal ideas tailored to your taste preferences, dietary requirements and cooking habits.
about.nutrition.f2.title=Calorie and macro targets
about.nutrition.f2.desc=Daily calorie goals and macronutrient breakdowns \u2014 protein, carbs and fats \u2014 aligned with your training intensity and body goals.
about.nutrition.f3.title=Pre and post-workout nutrition
about.nutrition.f3.desc=Specific guidance on what to eat before and after training sessions to maximise performance and recovery.
about.nutrition.f4.title=Dietary adaptations
about.nutrition.f4.desc=Plans that accommodate dietary preferences \u2014 vegetarian, dairy-free, gluten-free or any other requirements you have.
about.nutrition.why.title=Why nutrition matters
about.nutrition.why1.title=Results come from nutrition
about.nutrition.why1.desc=Studies consistently show that up to 70% of your physical transformation comes from what you eat \u2014 not just how you train.
about.nutrition.why2.title=Faster recovery
about.nutrition.why2.desc=Proper post-workout nutrition can cut recovery time in half \u2014 meaning you can train more effectively and more frequently.
about.nutrition.why3.title=Sustainable habits
about.nutrition.why3.desc=We focus on building long-term healthy eating habits \u2014 not crash diets or unsustainable restrictions.
about.nutrition.cta.title=Start eating for your goals
about.nutrition.cta.sub=Join a training programme and receive your personalised nutrition plan from day one.

# About equipment page
about.equipment.eyebrow=Premium facilities
about.equipment.title=Equipment and facilities
about.equipment.sub=Your trainer provides a personalised equipment guide for your programme \u2014 whether you\u2019re training at our club or at home.
about.equipment.club.title=At our studios
about.equipment.f1.title=Free weights area
about.equipment.f1.desc=Full range of dumbbells, barbells, kettlebells and weight plates \u2014 from beginner to advanced levels.
about.equipment.f2.title=Cardio machines
about.equipment.f2.desc=Treadmills, rowing machines, stationary bikes and ellipticals \u2014 all latest generation with integrated tracking.
about.equipment.f3.title=Functional training zone
about.equipment.f3.desc=Resistance bands, TRX suspension trainers, medicine balls and gymnastic rings for functional movement training.
about.equipment.f4.title=Yoga and stretching studio
about.equipment.f4.desc=Dedicated studio with mats, blocks, straps and bolsters \u2014 designed for yoga, Pilates and stretching classes.
about.equipment.home.title=For home training
about.equipment.home.sub=Your trainer will include a list of equipment needed for your specific programme \u2014 with home-friendly alternatives wherever possible.
about.equipment.home1.title=Essential kit list
about.equipment.home1.desc=A clear list of what you\u2019ll need \u2014 resistance bands, a mat, dumbbells \u2014 with suggested alternatives using household items.
about.equipment.home2.title=Equipment substitutions
about.equipment.home2.desc=Don\u2019t have a specific piece of equipment? Your trainer suggests alternatives so your programme stays effective regardless.
about.equipment.home3.title=Budget-friendly options
about.equipment.home3.desc=We recommend affordable yet quality equipment that will last and support your training long-term.
about.equipment.cta.title=Train with the best equipment
about.equipment.cta.sub=Join a programme and get your personalised equipment guide from your trainer.

