about.trainers.eyebrow=Біздің команда
about.trainers.gallery.title=Жаттықтырушыларымызбен танысыңыз
about.trainers.title=Жеке жаттықтырушылар
about.trainers.sub=FemFit мүшелерінің әрқайсысы сертификатталған жеке жаттықтырушымен жұмыс істейді, ол бағдарламаны сіздің мақсаттарыңызға, денеңізге және өміріңізге бейімдейді.
about.trainers.how.title=Жаттықтырушыңыз не жасайды
about.trainers.step1.title=Сізді танып біледі
about.trainers.step1.desc=Жаттықтырушы дайындық деңгейіңізді, денсаулық тарихыңызды, мақсаттарыңыз бен кестеңізді бағалаудан бастайды.
about.trainers.step2.title=Жеке бағдарламаңызды жасайды
about.trainers.step2.desc=Бағалауға сүйене отырып, жаттықтырушы жаттығулар, тамақтану, жабдықтар мен апталық кесте қамтылған толық жоспар жасайды.
about.trainers.step3.title=Прогресіңізді қадағалайды
about.trainers.step3.desc=Жаттықтырушы нәтижелеріңізді бақылап, жақсарған сайын бағдарламаны реттейді.
about.trainers.step4.title=Жолыңызда қолдайды
about.trainers.step4.desc=Бірдеңе сәйкес келмесе — өзгерту сұраңыз. Жаттықтырушы жоспарыңызды кез келген уақытта жаңартады.
about.trainers.features.title=FemFit жаттықтырушысы қалай ерекшеленеді
about.trainers.f1.title=Әйелдер физиологиясының мамандары
about.trainers.f1.desc=Барлық жаттықтырушыларымыз әйелдер физиологиясы, гормоналдық ерекшеліктер және өмірдің кез келген кезеңіндегі күш жаттығулары бойынша тәжірибелі.
about.trainers.f2.title=Толық сертификатталған
about.trainers.f2.desc=Әрбір жаттықтырушы танылған сертификаттарға ие және үнемі кәсіби дамиды.
about.trainers.f3.title=Нәтижеге бағытталған
about.trainers.f3.desc=Жаттықтырушыңыз сіздің прогресіңізге мүдделі — нәтижелерді өлшейді, жетістіктерді мерекелейді және жауапкершілікке үйретеді.
about.trainers.f4.title=Икемді және бейімді
about.trainers.f4.desc=Кесте өзгерсе, мақсат дамыса немесе жаңа нәрсе қажет болса — жаттықтырушы жоспарды бейімдейді.
about.trainers.cta.title=Бүгін жаттықтырушыңызбен танысыңыз
about.trainers.cta.sub=Бағдарламаны таңдаңыз және жұмыс жасағыңыз келетін жаттықтырушыны белгілеңіз.

about.community.eyebrow=Біздің қоғамдастық
about.community.title=Әйелдер қоғамдастығы
about.community.sub=FemFit — бұл жай спортзал емес. Бұл тек әйелдерге арналған кеңістік. Мұнда сіз қауіпсіз сезінесіз және прогресіңізді мерекелейтін адамдармен қоршалған боласыз.
about.community.space.title=Сіз үшін жасалған кеңістік
about.community.f1.title=Тек әйелдерге арналған
about.community.f1.desc=Барлық сабақтар, залдар, сеанстар — тек әйелдерге арналған. Сот жоқ, алаңдатушылық жоқ — тек сіз және сізді түсінетін қоғамдастық.
about.community.f2.title=Ашық және жылы
about.community.f2.desc=Жаңадан бастаушы немесе тәжірибелі спортшы болсаңыз да — FemFit сізді дәл өзіңіздей қабылдайды.
about.community.f3.title=Әрбір жеңісті мерекелейміз
about.community.f3.desc=Бірінші жаттығу, бірінші аяқталған бағдарлама — барлық жетістік маңызды. Біз прогресті бағалаймыз.
about.community.f4.title=Денсаулыққа назар аударамыз
about.community.f4.desc=Фитнес — бұл күш пен энергия туралы, дененіңізді жазалау туралы емес. Сіздің игілігіңіз әрдайым бірінші орында.
about.community.why.title=Қоғамдастық неге маңызды
about.community.why1.title=Тұрақты болу мүмкіндігі жоғары
about.community.why1.desc=Қолдаушы ортада жаттығатын адамдар фитнес әдетін ұзақ уақыт сақтауда үш есе табысты.
about.community.why2.title=Психикалық денсаулық жақсарады
about.community.why2.desc=Позитивті ортада жаттығу көңіл-күйді жақсартады, мазасыздықты азайтады және өзіне деген сенімді арттырады.
about.community.why3.title=Өмір бойы байланыс
about.community.why3.desc=FemFit-тегі танысулар жиі спортзалдан шығып кетеді. Көптеген мүшелер мұнда достар табады.
about.community.cta.title=FemFit қоғамдастығына қосылыңыз
about.community.cta.sub=Бір-бірін қолдайтын, мерекелейтін және бірге өсетін әйелдер қоғамдастығының бөлігі болыңыз.


