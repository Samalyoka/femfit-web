# About exercises page
about.exercises.eyebrow=Ваша программа
about.exercises.title=Персональные тренировки
about.exercises.sub=Каждый участник получает индивидуальный план упражнений, разработанный сертифицированным персональным тренером с учётом ваших целей, уровня подготовки и распорядка.
about.exercises.how.title=Как это работает
about.exercises.step1.title=Выберите программу
about.exercises.step1.desc=Просмотрите доступные циклы тренировок и выберите подходящий — силовой, кардио, гибкость или проработка всего тела.
about.exercises.step2.title=Выберите тренера
about.exercises.step2.desc=Выберите персонального тренера самостоятельно или позвольте нам подобрать наилучшего специалиста.
about.exercises.step3.title=Получите свой план
about.exercises.step3.desc=Тренер создаёт персональный план упражнений — с подходами, повторениями, временем отдыха и целями прогресса.
about.exercises.step4.title=Запросите изменения в любое время
about.exercises.step4.desc=Если какое-то упражнение вам не подходит, отправьте запрос на пересмотр. Тренер скорректирует план.
about.exercises.includes.title=Что входит в ваш план тренировок
about.exercises.f1.title=Силовые тренировки
about.exercises.f1.desc=Прогрессивные программы для формирования мышц и увеличения общей силы.
about.exercises.f2.title=Структурированное расписание
about.exercises.f2.desc=Чёткая недельная структура с днями тренировок, днями отдыха и активного восстановления.
about.exercises.f3.title=Постепенный прогресс
about.exercises.f3.desc=План развивается вместе с вами — с отслеживаемыми достижениями и плавным увеличением нагрузок.
about.exercises.f4.title=Поддержка тренера
about.exercises.f4.desc=Тренер отслеживает ваш прогресс и корректирует программу при необходимости.
about.exercises.cta.title=Готовы начать?
about.exercises.cta.sub=Выберите программу тренировок и получите персональный план от сертифицированного тренера.
about.exercises.cta.btn=Смотреть программы

# About nutrition page
about.nutrition.eyebrow=Питайтесь для результата
about.nutrition.title=Персональный план питания
about.nutrition.sub=Хорошая тренировка начинается на кухне. Тренер создаёт план питания, дополняющий ваши тренировки.
about.nutrition.includes.title=Что входит в план питания
about.nutrition.f1.title=Рекомендации по блюдам
about.nutrition.f1.desc=Практичные варианты блюд с учётом ваших предпочтений и диететических ограничений.
about.nutrition.f2.title=Нормы калорий и макронутриентов
about.nutrition.f2.desc=Дневная норма калорий и баланс БЖУ — белки, углеводы, жиры — соответствующие интенсивности тренировок.
about.nutrition.f3.title=Питание до и после тренировки
about.nutrition.f3.desc=Что есть до и после занятия — чтобы максимально ускорить восстановление и результат.
about.nutrition.f4.title=Индивидуальные особенности
about.nutrition.f4.desc=Планы для вегетарианцев, без молочных продуктов, без глютена или любых других ограничений.
about.nutrition.why.title=Почему важно питание
about.nutrition.why1.title=Результат зависит от питания
about.nutrition.why1.desc=Исследования показывают: до 70% физических изменений достигается через питание, а не просто тренировки.
about.nutrition.why2.title=Быстрое восстановление
about.nutrition.why2.desc=Правильное питание после тренировки может в два раза сократить время восстановления.
about.nutrition.why3.title=Устойчивые привычки
about.nutrition.why3.desc=Мы фокусируемся на долгосрочных правильных привычках питания, а не на жёстких диетах.
about.nutrition.cta.title=Начните есть для результата
about.nutrition.cta.sub=Запишитесь на программу и получите персональный план питания с первого дня.

