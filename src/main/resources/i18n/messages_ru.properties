about.schedule.f1.title=Соответствует вашему ритму
about.schedule.f1.desc=Тренер учитывает ваш рабочий график, семейные обязательства и личные предпочтения.
about.schedule.f2.title=Постепенные нагрузки
about.schedule.f2.desc=Каждая неделя строится на основе предыдущей — с запланированными неделями снижения нагрузки.
about.schedule.f3.title=Сбалансированное восстановление
about.schedule.f3.desc=Дни отдыха и активное восстановление встроены в план изначально.
about.schedule.f4.title=Гибкие корректировки
about.schedule.f4.desc=Жизнь непредсказуема. Запросите пересмотр расписания — тренер адаптирует план.
about.schedule.cta.title=Получите персональное расписание
about.schedule.cta.sub=Запишитесь сегодня и получите расписание, адаптированное под вашу жизнь.

about.trainers.eyebrow=Наша команда
about.trainers.gallery.title=Познакомьтесь с нашими тренерами
about.trainers.title=Персональные тренеры
about.trainers.sub=Каждый участник FemFit работает с сертифицированным персональным тренером, который создаёт программу с учётом ваших целей, особенностей тела и образа жизни.
about.trainers.how.title=Что делает ваш тренер
about.trainers.step1.title=Знакомится с вами
about.trainers.step1.desc=Тренер начинает с полной оценки вашего уровня физической подготовки, состояния здоровья, целей и распорядка дня.
about.trainers.step2.title=Составляет вашу программу
about.trainers.step2.desc=На основе оценки тренер создаёт полный план тренировок — включая упражнения, питание, инвентарь и недельное расписание.
about.trainers.step3.title=Отслеживает ваш прогресс
about.trainers.step3.desc=Тренер следит за результатами и корректирует программу по мере вашего роста — чтобы вы всегда двигались вперёд.
about.trainers.step4.title=Поддерживает вас на каждом шагу
about.trainers.step4.desc=Если что-то не подходит — запросите пересмотр. Тренер обновит план в любое время.
about.trainers.features.title=Чем тренер FemFit отличается от других
about.trainers.f1.title=Специалисты по женской физиологии
about.trainers.f1.desc=Все наши тренеры имеют опыт работы с женской физиологией, гормональными особенностями и силовыми тренировками на любом этапе жизни.
about.trainers.f2.title=Сертифицированные профессионалы
about.trainers.f2.desc=Каждый тренер имеет признанные сертификаты и постоянно повышает квалификацию.
about.trainers.f3.title=Ориентированы на результат
about.trainers.f3.desc=Ваш тренер заинтересован в вашем прогрессе — отслеживает результаты, отмечает достижения и помогает не сдаваться.
about.trainers.f4.title=Гибкий подход
about.trainers.f4.desc=Тренер адаптирует план если меняется ваш график, цели или просто нужно что-то другое.
about.trainers.cta.title=Познакомьтесь с вашим тренером сегодня
about.trainers.cta.sub=Выберите программу тренировок и тренера, с которым хотите работать. Ваш личный план будет готов с первого дня.

about.community.eyebrow=Наше сообщество
about.community.title=Женское сообщество
about.community.sub=FemFit — это больше чем спортзал. Это пространство, созданное исключительно для женщин, где вы чувствуете себя в безопасности и окружены людьми, которые поддерживают ваш прогресс.
about.community.space.title=Пространство, созданное для вас
about.community.f1.title=Только для женщин
about.community.f1.desc=Каждый класс, каждый зал, каждое занятие — исключительно для женщин. Без осуждения, без отвлечений — только вы и сообщество, которое вас понимает.
about.community.f2.title=Открытость и тёплый приём
about.community.f2.desc=Новичок вы или опытный спортсмен — FemFit принимает вас такими, какие вы есть.
about.community.f3.title=Отмечаем каждую победу
about.community.f3.desc=Первая тренировка, первая завершённая программа — каждое достижение важно. Мы ценим прогресс, а не совершенство.
about.community.f4.title=Забота о здоровье прежде всего
about.community.f4.desc=Мы верим, что фитнес — это про силу и энергию, а не про наказание тела. Ваше благополучие всегда на первом месте.
about.community.why.title=Почему сообщество важно
about.community.why1.title=Больше шансов не бросить
about.community.why1.desc=Люди, занимающиеся в поддерживающей среде, в три раза чаще сохраняют привычку к фитнесу на долгие годы.
about.community.why2.title=Лучшее психическое здоровье
about.community.why2.desc=Занятия в позитивной, доброжелательной атмосфере значительно улучшают настроение, снижают тревожность и повышают уверенность в себе.
about.community.why3.title=Связи на всю жизнь
about.community.why3.desc=Знакомства в FemFit часто выходят за пределы спортзала. Многие участницы находят здесь подруг и настоящее чувство принадлежности.
about.community.cta.title=Присоединяйтесь к сообществу FemFit
about.community.cta.sub=Станьте частью сообщества женщин, которые поддерживают, вдохновляют и растут вместе.

