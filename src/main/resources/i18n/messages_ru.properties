about.equipment.f4.title=Студия йоги и растяжки
about.equipment.f4.desc=Отдельная студия с ковриками, блоками и ремнями для йоги, пилатеса и растяжки.
about.equipment.home.title=Для домашних тренировок
about.equipment.home.sub=Тренер включит список необходимого инвентаря для вашей программы — с альтернативами для дома.
about.equipment.home1.title=Список необходимого
about.equipment.home1.desc=Чёткий список — ленты, коврик, гантели — с заменами из подручных предметов при необходимости.
about.equipment.home2.title=Замена инвентаря
about.equipment.home2.desc=Нет нужного оборудования? Тренер предложит альтернативы.
about.equipment.home3.title=Доступные варианты
